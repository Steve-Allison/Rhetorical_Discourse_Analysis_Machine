- id: coe:decision/specs-016/narrative/discourse_argumentation
  label: Discourse and argumentation vocabulary registration (AI_Skills specs/016)
  description: Registration decision for the discourse/argumentation taxonomy consumed by AI_Skills and Content_Structuring_Machine.
  decision_date: '2026-08-31'
  authority: Central_Configs
  decision_status: ratified
  statement: coe:module/narrative/discourse_argumentation registers seven closed sets profiled from named published standards
    — PDTB 3.0 Level-2 discourse relation senses, PDTB explicit/implied relation explicitness, Toulmin argument roles, argument
    component state, ASPIC+ argument conflict types, rhetorical discourse roles via the deletion test, and argument link types
    from argument mining's support and attack relations.
  rationale: The narrative domain's ratified definition owns discourse and argumentation structure; the owner ruled the PDTB
    Level-2 five-sense profile and standards-verbatim role names on 2026-08-31 (AI_Skills specs/016-knowledge-substrate-seam,
    contracts/vocabulary-registration.md), so shared consumers take one governed token set instead of inventing local duplicates.
- id: coe:decision/rdam-006/narrative/analytical_frameworks
  label: Analytical framework identity registration (isanlp_rst specs/006)
  description: Registration decision for the canonical framework-identity taxonomy consumed by the Rhetorical Discourse Analysis
    Machine and estate consumers.
  decision_date: '2026-08-31'
  authority: Central_Configs
  decision_status: ratified
  statement: coe:module/narrative/analytical_frameworks registers canonical identities for ten analytical frameworks in three
    classes — discourse structure frameworks (RST, eRST, PDTB, SDRT), argumentation frameworks (Toulmin, Walton's schemes,
    IBIS, Dung's abstract argumentation, argument mining), and communication frameworks (Pyramid Principle) — as the shared
    framework roster of the estate.
  rationale: The narrative domain owns discourse and argumentation meaning; the owner ruled on 2026-08-31 (isanlp_rst
    specs/006-rhetorical-discourse-machine) that technique production boundaries bind to canonical framework identities rather
    than spec-local strings, so every consumer names the same framework by the same identifier. Framework identity is orthogonal
    to the closed vocabulary profiles registered by AI_Skills specs/016; native technique inventories remain provider-owned.
- id: coe:decision/rdam-006/narrative/argument_role_profile_wording
  label: Argument role description clarified as a five-role Toulmin profile (superseded)
  description: Wording correction for the argument_role concept in the discourse/argumentation taxonomy; superseded the same
    day by the backing amendment because its deliberate-exclusion rationale was not supported by any recorded ruling.
  decision_date: '2026-08-31'
  authority: Central_Configs
  decision_status: superseded
  statement: The argument_role description now states explicitly that the set is a closed five-role profile of Toulmin's (1958)
    six-element layout — claim, grounds, warrant, qualifier, rebuttal, with backing deliberately not registered — replacing
    wording that could be read as claiming Toulmin's complete layout verbatim.
  rationale: Superseded by coe:decision/rdam-006/narrative/argument_role_backing_amendment. This decision asserted that backing
    was excluded by ruling, but the AI_Skills specs/016 vocabulary-registration contract records no exclusion ruling for
    argument_role; the owner subsequently ruled the omission a drafting error and amended the set to Toulmin's complete
    six-element layout.
- id: coe:decision/rdam-006/narrative/argument_role_backing_amendment
  label: Argument role set amended to Toulmin's complete six-element layout
  description: Registered amendment adding backing to the argument_role set of the discourse/argumentation taxonomy, making
    the set verbatim-complete against Toulmin (1958).
  decision_date: '2026-08-31'
  authority: Central_Configs
  decision_status: ratified
  statement: coe:concept/discourse_argumentation_taxonomy/argument_role/backing joins the registered argument_role set, completing
    Toulmin's (1958) six-element layout — claim, grounds, warrant, backing, qualifier, rebuttal — at taxonomy version 1.1.0;
    the set remains closed with growth by registered amendment only.
  rationale: The owner ruled on 2026-08-31 that the original five-token registration omitted backing by drafting error, not
    by ruling — the AI_Skills specs/016 vocabulary-registration contract records explicit rulings for its deliberately profiled
    sets (selected PDTB Level-2 senses, coarse RST discourse roles) but none for argument_role, whose "role names verbatim"
    source note indicates completeness was intended. Without backing, field-specific support for a warrant is silently mislabelled
    as grounds, corrupting downstream extraction. Growth follows the contract's registered-amendment path; commit-pinned
    consumers are unaffected until they refresh. Supersedes coe:decision/rdam-006/narrative/argument_role_profile_wording.
- id: coe:decision/specs-016/learning/realisation_forms
  label: Realisation forms vocabulary registration (AI_Skills specs/016)
  description: Registration decision for the realisation-forms taxonomy consumed by AI_Skills content-map and its downstream
    builders.
  decision_date: '2026-08-31'
  authority: Central_Configs
  decision_status: ratified
  statement: coe:artifact/learning/realisation_forms_taxonomy registers the artefact forms realising one pedagogic unit in
    two classes — instructional forms (formal_module, workshop_session, deck, video, podcast_episode) discharge a taught disposition
    and support forms (job_aid, aide_memoire, performance_support) discharge a performance-support disposition.
  rationale: The learning domain owns learning formats and instructional architecture; the owner ruled the eight builder-agnostic
    forms and the two-class discharge semantics on 2026-08-31 (AI_Skills specs/016-knowledge-substrate-seam), making the class
    membership registered semantics rather than any one consumer's convention.
- id: coe:decision/curation/2026-09-01/threshold-typing
  label: Thresholds typed numeric with units and mandatory bounds
  description: Batch curation decision re-authoring every scoring-model threshold under the typed Threshold contract, with
    values recovered from the immutable legacy sources.
  decision_date: '2026-09-01'
  authority: Central_Configs
  decision_status: ratified
  statement: coe:Threshold requires a numeric target_value, minimum_value, or maximum_value (at least one), a unit, and a
    real description. The previously valueless or stringly-typed thresholds in the six scoring modules (visual_communication/design_quality_gates,
    business/commercial_rubrics, narrative/quality_rubrics, language_editorial/accessibility, learning/assessment_rubrics,
    visual_communication/presentation_quality) are re-authored under this contract — structured legacy threshold dicts are
    decomposed into one threshold per measured quantity, target/min/max key families are merged onto single thresholds, prose
    ranges become minimum and maximum bounds, the spaced_review_days list becomes three interval thresholds, and the boolean
    color_semantic_uniqueness becomes a uniqueness-ratio target of 1.0.
  rationale: The v4 migration flattened structured legacy thresholds to bare keys and quoted every scalar, leaving 17 thresholds
    with no value at all and the rest untyped. Every recovered value is read from the cited immutable legacy blobs at f6eb98ff
    (data_visualisation_rubric, elevator_pitch_rubric, narrative_quality_rubric, accessibility_rubric, cognitive_load_rubric,
    instructional_design_rubric, presentation_profiles_rubric, visual_design_rubric, video_multimedia_rubric); the at-least-one-bound
    rule is enforced by schema any_of with counterexamples in ontology/examples/invalid, so a boundless or stringly threshold
    can no longer validate.
- id: coe:decision/curation/2026-09-01/artifact-version-retirement
  label: Per-artifact version stamps retired
  description: Batch curation decision removing semantic-version stamps from ordinary authored artifacts.
  decision_date: '2026-09-01'
  authority: Central_Configs
  decision_status: ratified
  statement: KnowledgeArtifact no longer mixes in Versioned; every per-artifact version stamp in the authored domain data
    is removed. The one authoritative ontology version is the version of ontology/data/distribution.yaml, and the Versioned
    mixin remains only on OntologyDistribution.
  rationale: Artifact stamps such as 1.3.2 or 2.14.3 contradicted the single 4.0.0 distribution version, were frozen at migration
    and never advanced, and duplicated history that Git already records. A schema counterexample (DomainModule-artifact-version-stamp)
    proves a stamped artifact no longer validates.
- id: coe:decision/curation/2026-09-01/lexicon-description-dedup
  label: Sense and term descriptions retired from the lexicon
  description: Batch curation decision making the definition a sense's single prose authority and removing all lexicon description
    duplication.
  decision_date: '2026-09-01'
  authority: Central_Configs
  decision_status: ratified
  statement: Term and TermSense forbid the description slot (value_presence ABSENT). All 740 sense descriptions — every one
    byte-identical to its definition — and all 731 generated term descriptions of the form "Cross-domain lexical container
    for the surface form X." are removed from coe:module/language_editorial/lexicon; definitions are preserved byte-identical.
  rationale: A second prose slot equal to the definition is a drift channel, not information — meaning could silently fork
    between the two texts — and the term-level boilerplate restated the surface form in violation of the description standard.
    The census found 740 identical pairs and zero differing pairs, so nothing was lost by removal; the schema ban with the
    DomainModule-sense-description counterexample makes reintroduction impossible rather than merely detectable, which subsumes
    the planned zero-identical-pairs gate.
- id: coe:decision/curation/2026-09-01/taxonomy-broader-review
  label: Broader-than review of all 24 concept schemes
  description: Batch curation decision recording the Phase 3 taxonomy-correctness review and its eight dispositions.
  decision_date: '2026-09-01'
  authority: Central_Configs
  decision_status: ratified
  statement: All 557 authored broader links across the 24 concept schemes of the ai, language_editorial, learning, and narrative
    domains were reviewed against the ISO 25964 all-some test (every case of the narrower concept is a case of the broader
    concept); 549 hold as authored and 8 findings are disposed as follows. In ai_systems_taxonomy, reranking moves from
    retrieval_strategy to pipeline_stage (it composes with retrieval strategies rather than being one) and the
    evaluation_dimension head is re-scoped to cover system performance so latency's membership is true. In learning, the
    group_format head is defined as an enumerated value set including the no-constraint value Any, and the assessment_scope
    head is re-scoped to cover cross-cutting scopes so workplace_level and modality_level are true members. In narrative,
    evidence_category declares rhetorical_device as its explicit sentinel support type; the emotional_tone/kairos concept
    is removed (kairos is a timing appeal, not an affective register — its canonical home is
    evidence_types_taxonomy/rhetorical_appeal/kairos); and rhetorical_devices' kairos re-homes from structural_framework
    to aristotelian_appeal, whose head now names all four appeals. Re-homed concepts take ids matching their facet
    (pipeline_stage/reranking, aristotelian_appeal/kairos); both old ids were referenced nowhere outside their own
    definitions. A new SHACL taxonomy shape forbids cross-scheme broader links (zero existed; the shape was falsified
    against a synthetic violating graph), and DomainDefinition gains a taxonomy_review field recording the per-domain
    verdicts.
  rationale: Phase 3 of the world-class plan under the hybrid execution mode — four review agents proposed per-domain
    verdicts covering every link, and every finding was re-verified against the authored files before disposal. No
    wrong-direction links and no framework-stage misfilings exist because stages are parented to stage-dimension heads,
    never to framework concepts. The unreviewable-membership pattern (bare-slug member definitions forcing label-based
    judgement) is recorded as deferred definition-quality debt alongside the 57 name-restating sense definitions.
- id: coe:decision/curation/2026-09-01/taxonomy-definition-recovery
  label: Taxonomy leaf definitions recovered and prefix-era glossary retired
  description: Batch curation decision covering the slug-echo definition recovery across four taxonomy files, the mangled-name
    corrections, and the owner-ruled removals of superseded and undefined concepts.
  decision_date: '2026-09-01'
  authority: Central_Configs
  decision_status: ratified
  statement: The 488 concept descriptions that were slug echoes of their labels across ai_systems_taxonomy, the tone_archetypes
    taxonomies, the learning taxonomies, and the story_frameworks taxonomies are re-authored from the immutable legacy files
    at f6eb98ff or, where legacy is enumeration-only, from the named published frameworks (Bloom, Kirkpatrick, Sweller, Mayer,
    Mann and Thompson, Hyland, and peers), with established framework vocabulary cited verbatim and never renamed. Twenty
    migration-mangled labels are corrected (RAG, CAG, ReAct, PDL Declarative, ILT, Virtual ILT, eLearning, RST, PDTB, SDRT,
    eRST, SCQA, CTA, Hero's Journey, StoryBrand, Grade 6-8, Grade 9-12). By owner ruling of 2026-09-01, the eight prefix-era
    corpus_glossary concepts (both audience rows, both narrative_stage rows, the three pov rows, and the mis-ingested table-header
    artifact bare_word_do_not_use_bare) are removed as pre-ontology disambiguation machinery superseded by the v4 Term and
    TermSense model — their recovered canonical definitions are preserved in governance/GLOSSARY.md at f6eb98ff (b_audience
    buyers evaluating a decision, l_audience learners acquiring capability, b_narrative_stage a SOAR/SCQA business story
    stage, l_narrative_stage a Kolb learning-cycle stage, v_pov a camera shot, n_pov a storytelling stance, b_pov an argued
    business position) for re-addition as lexicon senses if a consumer claims them. The undefined narrative_tier facet (head
    and values L1-L4) is removed from character_archetypes_taxonomy by the same ruling; its probable referent is the FY26
    sales-play hierarchy (L1 Portfolio Play, L2 Strategic Sales Play, L3 Application Sales Tactic, L4 Industry Adaptation,
    per library/business/play_catalog_reference.yaml), which belongs to the business domain if ever needed. A validate-layout
    gate now fails on any slug-echo concept description or classification-dimension stub head.
  rationale: The v4 migration flattened per-value legacy definitions to bare slugs, leaving concepts unusable without external
    context and forcing the Phase 3 broader review to judge from labels. Recovery searched the full f6eb98ff revision, which
    exposed that the original migration catalogued only library/ and omitted the governance canon layer — the corpus_glossary's
    cited source (library/writing/glossary_terminology.yaml) is wrong; its actual source is governance/GLOSSARY.md, now
    registered with governance/TAXONOMY.md as source records and added to the tone_archetypes evidence. The full-corpus
    search also corrected two agent errors before they persisted — the pov triplet was recoverable after all, and a proposed
    l_narrative_stage definition had misattributed Kolb's learning cycle to Gagné.
- id: coe:decision/curation/2026-09-01/relational-completeness
  label: Cross-domain edges authored from consumer-consumption mining
  description: Batch curation decision recording the Phase 4 disposition of the eight cross-domain edge candidates mined
    from Deck Creation Machine's actual consumption of the ontology.
  decision_date: '2026-09-01'
  authority: Central_Configs
  decision_status: ratified
  statement: Four edges are authored. coe:edge/mayer-supports-video-multimedia-rubric re-authors the legacy
    mayer_principles-to-video_multimedia_rubric edge (deleted with the restored/ corpus) on the properly authored subject
    coe:entity/mayers_multimedia_principles, grounded in the rubric's own Mayer-derived dimension and threshold
    (visual-narration synchronisation; mayer_critical_principles_required). coe:edge/expertise-reversal-limits-mayers-multimedia-principles
    records the expertise reversal effect as a boundary condition on the whole principle framework.
    coe:edge/minto-bridges-mayers-multimedia-principles and coe:edge/minto-supports-presentation-profiles-rubric record the
    Minto Pyramid's argument-layer role beside Mayer's media-layer role and its operationalisation by the presentation
    profiles rubric's structure thresholds (BLUF position, action-title share, topic-label ceiling, vertical-flow floor).
    One candidate is skipped as already authored (mayer_extraneous_principle specialises learning_principle,
    coe:edge/541ab41b3de78d28da46a440). Four candidates are rejected — the SOAR-limits-slide_archetypes candidate because
    its subject exists only as the taxonomy concept
    coe:concept/presentation_structures_taxonomy/structural_framework/soar_framework and SemanticEdges are authored on
    entities, so the claim has no valid subject without duplicating the concept as an entity; and the three
    pipeline-sequencing candidates because they describe the consumer's own workflow ordering, which AGENTS.md places
    outside the ontology's authority.
  rationale: Phase 4 of the world-class plan targets relational completeness driven by proven consumption rather than
    speculative linking — every authored edge names the consuming mechanism that breaks if the relation is wrong, and every
    rejected candidate is recorded with its reason so the mining is not silently re-litigated. Authored-edge statement ids
    are readable slugs distinguishing curated Phase 4 edges from migration-hashed ids.
- id: coe:decision/curation/2026-09-01/adobe-definition-recovery
  label: Adobe and competitor boilerplate definitions re-authored from documentation
  description: Batch curation decision replacing every name-restating or category-boilerplate description across the four
    Adobe modules and the competitor-segment entities, and syncing the lexicon senses that mirrored them.
  decision_date: '2026-09-01'
  authority: Central_Configs
  decision_status: ratified
  statement: All 179 boilerplate entity descriptions in the adobe domain are re-authored as genus-differentia definitions —
    the 15 Agent Orchestrator agents (grounded in the Experience League Agent Orchestrator course and field-readiness
    documentation retrieved via Adobe internal search on 2026-09-01), the 36 brand-architecture concepts, the 27 platform
    technologies, and the product portfolio's category-boilerplate entries (Experience Cloud, Creative Cloud, Document
    Cloud, GenStudio, Firefly, and Acrobat families), with the thin or ambiguous names (Success Studio as the pre-GA name
    of Sites Optimizer, Federated Search, GenStudio Services, the Firefly enterprise sub-brands, Commerce as a Cloud
    Service, Dynamic Chat) each grounded by a dedicated documentation search rather than asserted from memory. The six
    business competitor-segment entities are re-authored from the immutable legacy competitors_entities.yaml at f6eb98ff —
    category descriptions, the Adobe products they compete against, and vendor rosters — and their slug labels replaced
    with proper labels. All 185 lexicon sense definitions that mirrored the old boilerplate are synced to the re-authored
    entity descriptions by a deterministic denotes-target replacement; zero boilerplate patterns remain anywhere in the
    authored data.
  rationale: The v4 migration generated these descriptions from category templates ("Adobe architecture concept X", "X
    enterprise solution (Experience Cloud)"), leaving the ontology's Adobe vocabulary undefined in exactly the domain the
    organisation exists to describe, and the lexicon mirrored the same emptiness 185 times. Every recovered definition
    names what the thing is and what distinguishes it; documentation-grounded facts were preferred to memory throughout,
    and the one identity discovery (Success Studio being the pre-GA name of AEM Sites Optimizer) is recorded in both
    entities rather than silently merged.
- id: coe:decision/curation/2026-09-01/external-anchoring
  label: Published external anchors for the named-framework instances
  description: Batch curation decision recording the Phase 5 skos mapping-slot hoist and the verified Wikidata anchors added
    to the canonical Bloom, Mayer, and Toulmin instances.
  decision_date: '2026-09-01'
  authority: Central_Configs
  decision_status: ratified
  statement: The exact_match and close_match attributes (skos:exactMatch, skos:closeMatch) move from OntologyEntity up to
    SemanticResource, so Concepts and KnowledgeArtifacts can carry external anchors alongside entities; existing entity
    anchors (the six Adobe product exact_match values) are unaffected by the hoist. Three close_match anchors are added,
    each verified against the live Wikidata entity-search API on 2026-09-01 — coe:entity/cognitive_level to Q1774565
    (Bloom's taxonomy), coe:entity/mayers_multimedia_principles to Q5819925 (multimedia learning, the cognitive-science
    principles item), and coe:concept/discourse_argumentation_taxonomy/argument_role to Q1323298 (Toulmin method). All
    three are close_match, not exact_match, because each authored instance profiles one dimension of the published
    framework rather than being interchangeable with it. No anchor is added for the Kirkpatrick instances — Wikidata holds
    no item for the four-level evaluation model (searches for the model, its four levels, and training evaluation all
    return empty), and anchoring the model to the person item Q282187 (Donald Kirkpatrick) would be a category error.
  rationale: External anchors make the ontology's framework vocabulary independently checkable against published identity
    rather than resting on labels alone, and skos mapping properties belong at the shared resource level — SKOS defines
    them for concepts, which the previous OntologyEntity-only placement excluded. Every anchor cites an identifier verified
    to resolve at decision time; no identifier is asserted from memory, which is how the Kirkpatrick gap is a recorded
    absence rather than a guessed QID.
- id: coe:decision/curation/2026-09-01/wiki-concordance-corrections
  label: Factual and evidential corrections from the wiki concordance audit
  description: Batch curation decision recording the seven entity-description corrections surfaced by the full
    wiki-to-ontology concordance audit, and the sync of their mirrored lexicon senses.
  decision_date: '2026-09-01'
  authority: Central_Configs
  decision_status: ratified
  statement: 'Seven authored descriptions are corrected against the knowledge wiki''s evidence records (all 296 wiki pages
    audited against the full Central id inventory on 2026-09-01). coe:entity/mayers_multimedia_principles said "12
    principles" while Central itself models fifteen per-principle entities — the count is corrected to fifteen (wiki:
    mayers-multimedia-principles). coe:entity/voice_principle stated the human-beats-machine voice preference as settled;
    the finding has reversed under modern neural TTS, and the description now scopes the principle to legacy robotic
    monotone (wiki: voiceover-and-narration). coe:entity/four_mat_model gains the load-bearing caveats that its
    learner-type-matching rests on the refuted meshing hypothesis and its hemispheric rationale is superseded (wiki:
    mccarthy-4mat-framework, learning-styles-debate). coe:entity/ten_two_rule gains the caveat that its fixed 10-minute
    cadence inherits the contested lecture-attention-span claim while its retrieval breaks remain well-evidenced (wiki:
    attention-span-during-lectures). coe:entity/microlearning_nugget''s 3-10 minute duration is corrected to the
    evidence-based 2-5 minutes with a 7-minute maximum (wiki: microlearning). coe:entity/jitter_metric and
    coe:entity/shimmer_metric presented clinical perturbation thresholds (< 1.04%, < 3.81%) as authority benchmarks; both
    are re-scoped as sustained-vowel dysphonia norms invalid on running speech (wiki: voice-quality-measurement). The
    seven lexicon senses mirroring these entities are synced deterministically by denotes-target.'
  rationale: The concordance audit read every wiki page in full against the complete inventory and surfaced exactly these
    factual defects — a stale count contradicting Central's own instances, two claims the cited evidence record has since
    reversed or contested, one duration contradicting the evidence-based specification, and two clinical thresholds
    misframed as communication benchmarks. Each correction makes the description true rather than suppressing the
    disagreement; contested claims are recorded as contested instead of silently smoothed. The wiki is a living curated
    authority whose history Git records, so corrections cite this decision and the named pages rather than a pinned
    snapshot record.
- id: coe:decision/curation/2026-09-01/wiki-entry-recovery
  label: 107 canonical entries recovered from the knowledge wiki concordance
  description: Batch curation decision authoring the new-entry proposals that survived the eight-agent wiki-to-ontology
    concordance audit, as canonical OntologyEntity records with genus-differentia definitions.
  decision_date: '2026-09-01'
  authority: Central_Configs
  decision_status: ratified
  statement: 107 entities absent from Central but owned as full treatments by the knowledge wiki are authored as canonical
    entries. Learning gains 55 in the new learning_sciences module — fifteen learning and cognitive theories (Bandura SCT,
    cognitive apprenticeship, connectivism, critical thinking, deliberate practice, goal-setting theory, growth mindset,
    metacognition, nudge theory, psychological safety, Schank's script theory, theory of mind, Tuckman group development,
    plus the refuted Learning Pyramid and learning-styles meshing recorded for flagging), ten instructional design models
    (BOPPPS, Dick and Carey, Elaboration Theory, Baldwin-Ford transfer, Morrison-Ross-Kemp, Responsive Scaffold Model,
    Rosenshine's principles, scheme-of-work design, Three Cs scenario design, UDL), ten methods and formats (70-20-10,
    case-based learning, coaching frameworks, gamification and GBL, icebreakers, immersive learning, manager as coach,
    spaced repetition, inclusion personas, screencast), twenty assessment and measurement disciplines (multi-source
    feedback, AI content detection, method selection, automated essay scoring, cognitive diagnostic modelling,
    computer-adaptive testing, construct validity under AI, cross-cultural validity, demo certification, hard-soft skills
    routing, inter-annotator agreement, Kane's validity framework, microcredentialing, OKR-KPI frameworks, oral
    assessment, portfolio assessment, pre-employment selection, psychometrics, social network analysis, stealth
    assessment), and two knowledge organisation disciplines (knowledge organisation, ontology engineering). Narrative
    gains ten in the new communication_disciplines module (Freytag's Pyramid, Save the Cat, Story Spine, Golden Circle,
    SUCCES, live speechwriting, dialectic, the CER framework, audience analysis, audience design). Visual communication
    gains eighteen in the new design_disciplines module (accessible data visualisation, art direction, CRAP principles,
    graphic encoding theory, UX honeycomb, image production, infographic design, knowledge visualisation, Lottie
    authoring, multivariate and system-dynamics visualisation, visual modality decision, whiteboarding, synthetic
    presenter, director's treatment, moodboard, style frame, motion and flash accessibility). AI gains nine in the new
    knowledge_systems module (agentic instructional pipeline, UNESCO AI competency frameworks, agent skill, ToM prompting
    architectures, knowledge graph construction, human-AI curation, semantic wiki architecture, topic modelling, LLM as
    judge). Delivery gains six appended to presence_rubrics (scenography, McNeill gesture taxonomy, personal branding,
    Q&A handling, reading the room, rehearsal and dry run). Business gains four appended to buyer_personas (empathy
    mapping, jobs to be done, persona method, product demo delivery). Language editorial gains three appended to
    style_rules (localisation, culture as audience variable, critical finding craft). One agent proposal is rejected —
    AI artifact surfaces — as a volatile product-landscape reference, not stable canonical meaning; the wiki keeps it.
    Compendium pages, immature fields, and wiki-delegated bibliographic material were already excluded by the audit
    itself, with reasons recorded in the audit reports.
  rationale: The eight-agent concordance audit read all 296 wiki pages in full against the complete 3,000-row Central
    inventory and found these referents entirely absent despite Central holding their satellite instruments, markers and
    facet values — the disciplines the estate's own instruments belong to. Each authored description is a self-sufficient
    genus-differentia definition distilled from the wiki page that owns the full treatment; contested and refuted
    material is recorded as such in the definition itself. The wiki is a living curated authority whose history Git
    records, so these entries cite this decision and the named material rather than a pinned snapshot record. Wiki page
    names match entry slugs closely enough to relocate every source page directly.
- id: coe:decision/curation/2026-09-01/wiki-relational-mining
  label: 67 semantic edges mined from the wiki's typed relation tiers
  description: Batch curation decision authoring the curated cross-reference edges disposed from the strong-tier
    (Foundations, Applications, Siblings, Contrasts) relations reported by the wiki concordance audit.
  decision_date: '2026-09-01'
  authority: Central_Configs
  decision_status: ratified
  statement: 67 SemanticEdges are authored from the several hundred strong-tier relations the concordance audit reported,
    under three selection rules — both endpoints must be authored entities (taxonomy concepts and rubric artifacts are
    never edge endpoints, per the Phase 4 ruling), the relation must map cleanly onto one canonical-direction predicate,
    and every subject is one of the newly recovered wiki entries so the edges live on the records this disposal created.
    The set spans all seven non-adobe domains — learning theory-to-method grounding (script theory to scenarios, ToM to
    audience design, metacognition to assessment-as-learning), the design-model contrast triangle (Dick and Carey, SAM,
    Morrison-Ross-Kemp), the spacing-testing compound (spaced repetition bridges the testing effect), the psychometrics
    containment family (IRT, G-Theory, DIF) and its Kane chain, the AI-assessment cluster (construct substitution rebuts
    detection, LLM judging limits inter-annotator agreement), the pre-production pipeline (moodboard precedes style
    frame), motion-safety limits on slide transitions and animation, the persona method family, and the refuted
    meshing hypothesis rebutting 4MAT's matching prescription. Relations whose endpoints are taxonomy concepts,
    whose direction fits no authorable predicate, or whose content is already carried by the entities' own
    definitions are not authored; the full candidate set remains in the audit reports.
  rationale: The wiki's typed Related-pages tiers are curated, human-verified relation claims; disposing the strongest
    of them as first-class edges makes the recovered entries navigable rather than isolated. Selection was deliberately
    conservative — one canonical direction per claim, no reciprocal duplicates, readable statement-id slugs, and no
    edges asserted beyond what the owning wiki pages themselves state.
- id: coe:decision/curation/2026-09-01/wiki-entry-enrichment
  label: NER calibration and lexicon coverage for the 107 wiki-recovered entries
  description: Batch curation decision completing extraction support for the wiki-recovered entries — per-entity
    recognition calibration and one lexicon term with one sense per entity.
  decision_date: '2026-09-01'
  authority: Central_Configs
  decision_status: ratified
  statement: Every one of the 107 entities authored by the wiki-entry-recovery decision gains recognition calibration —
    positive surface-mention examples, anti-examples marking confusable neighbours where they exist (generic surface
    forms such as critical thinking, localisation and whiteboarding carry lower confidence thresholds around 0.65-0.75
    with anti-examples; distinctive named frameworks such as BOPPPS, Lottie and CRAP carry 0.85-0.9), and a
    confidence_threshold. The lexicon gains one Term per entity (838 terms from 731) and one TermSense per entity (847
    senses from 740), minted under the migration tooling's exact id scheme — term ids from the first ten hex characters
    of the SHA-256 of the lowercased surface form, sense ids from the first sixteen hex characters of the SHA-1 of the
    denoted entity id — inserted in the lexicon's sorted order, each sense carrying the entity's definition verbatim as
    its single prose authority, a case-insensitive whole-phrase recognition pattern, and alias patterns for the
    established initialisms (ToM, BOPPPS, UDL, 70-20-10, 360-degree feedback, SNA, SUCCES, CER, Lottie, JTBD).
  rationale: The recovered entries were authored definition-first; without examples, thresholds and lexicon senses they
    could not participate in recognition and term resolution alongside the rest of the vocabulary. Reproducing the
    deterministic id scheme keeps the new terms indistinguishable from migrated ones, so no consumer needs a special
    case; ambiguous short initialisms (CAT, AES, CDM, IAA) deliberately receive no alias pattern because their
    collision surface outweighs their recall value.
