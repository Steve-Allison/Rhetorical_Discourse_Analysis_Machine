_meta:
  file_id: coe:file/domain/adobe/services
  title: Adobe — Services
  last_updated: '2026-10-18'
  authority: Central_Configs
  scope: domain
  ontology_domain: adobe
  governing_class: coe:DomainModule
module_id: coe:module/adobe/services
domain: adobe
services:
- id: coe:entity/adobe/adobe_developer
  label: Adobe Developer Platform
  description: Adobe Developer Platform is Adobe's open developer platform, centered on developer.adobe.com, that provides
    APIs, events, SDKs, runtimes, tools, and documentation so developers can integrate with and extend Adobe Creative Cloud,
    Experience Cloud, Document Cloud, and Firefly Services across web and enterprise workflows.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  terms:
  - literal: Adobe Developer
    term_type: short_form
    term_status: admitted
  - literal: ADP
    term_type: initialism
    term_status: admitted
  - literal: Adobe I/O
    term_type: full_form
    term_status: superseded
- id: coe:entity/adobe/pdf_services_api
  label: Adobe PDF Services API
  description: Adobe's developer API for programmatic PDF operations — creating, converting, recognising text in,
    extracting from and manipulating documents inside applications and pipelines.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/document_cloud
- id: coe:entity/adobe/acrobat_services
  label: Adobe Acrobat Services
  description: Adobe Acrobat Services is Adobe's family of cloud-based document APIs—including PDF Services, PDF Embed, Document
    Generation, PDF Extract, PDF Electronic Seal, PDF Accessibility Auto-Tag, and Acrobat Sign APIs—that lets developers embed
    rich PDF and agreement workflows into web and server applications.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/document_cloud
  terms:
  - literal: Acrobat Services
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/firefly_services
  label: Adobe Firefly Services
  description: Adobe Firefly Services (Firefly Creative Production for Enterprise) is an enterprise-only collection of generative
    and creative APIs—including Firefly image/video generation plus Photoshop, Lightroom, InDesign, audio/video and content-tagging
    services—that lets organizations automate high-volume, brand-safe content production such as variants, localization and
    asset refreshes via REST APIs.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/creative_cloud
  - coe:entity/adobe/content_supply_chain_solution
  serves_stage:
  - coe:entity/adobe/creation_production
  terms:
  - literal: Firefly Services
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/genstudio_services
  label: GenStudio Services
  description: GenStudio Services (GenStudio Experience API) is GenStudio's public, read-only REST API that lets partner and
    enterprise applications list and filter approved experiences, retrieve full experience metadata, templates and short-lived
    asset delivery URLs, so GenStudio content can flow programmatically into external channels and workflows using Adobe IMS
    OAuth server-to-server credentials.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/genstudio
- id: coe:entity/adobe/web_sdk
  label: Adobe Experience Platform Web SDK
  description: Adobe's client-side JavaScript library that sends website data to the Experience Platform Edge Network and
    receives audience qualifications and personalised content back.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/experience_cloud
  conforms_to:
  - coe:entity/adobe/experience_data_model
  terms:
  - literal: Web SDK
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/mobile_sdk
  label: Adobe Experience Platform Mobile SDK
  description: Adobe Experience Platform Mobile SDK is a modular mobile SDK that sends app data in XDM format to the Adobe
    Experience Platform Edge Network and integrates with solutions such as Analytics, Campaign, Audience Manager and Target
    to power real-time personalization, consent management and end-to-end engagement in mobile applications.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/experience_cloud
  conforms_to:
  - coe:entity/adobe/experience_data_model
  terms:
  - literal: Mobile SDK
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/edge_network_server_api
  label: Experience Platform Edge Network Server API
  description: The Adobe Experience Platform Edge Network Server API is a secure, authenticated REST API for sending events
    from servers, IoT devices and other non-browser clients to the Platform Edge Network for data collection, personalization,
    advertising and marketing use cases, as a server-side alternative to the Web and Mobile SDKs.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/experience_cloud
  terms:
  - literal: Edge Network Server API
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/data_access_api
  label: Data Access API in Adobe Experience Platform
  description: Adobe Experience Platform Data Access API is a RESTful interface that provides raw and XDM-level access to
    ingested Data Lake datasets for discoverability and export to external tools, but it is now deprecated and new implementations
    should use dataset export destinations in Adobe Experience Platform instead.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/experience_cloud
  terms:
  - literal: Data Access API
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/visitor_id_service
  label: Adobe Visitor ID Service
  description: Adobe Visitor ID Service is the legacy JavaScript library that assigns a universal Experience Cloud ID (ECID)
    shared across CX Enterprise solutions such as Analytics, Audience Manager and Target; it is distinct from Adobe Experience
    Platform Identity Service, and when using the Adobe Experience Platform Web SDK you typically rely on its built-in identity
    capabilities rather than deploying the Visitor ID Service library.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/experience_cloud
  terms:
  - literal: Visitor ID Service
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/pdf_embed_api
  label: Adobe PDF Embed API
  description: Adobe PDF Embed API is a free, client-side JavaScript API from Acrobat Services that embeds a rich PDF viewer
    in web applications, providing consistent in-browser document viewing along with collaboration, review workflows and analytics
    integration.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/document_cloud
  terms:
  - literal: PDF Embed API
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/document_generation_api
  label: Adobe Document Generation API
  description: Adobe Document Generation API is a cloud service that dynamically merges JSON data into Word (DOCX) or HTML
    templates with conditional logic to generate PDF or Word documents such as contracts, invoices and sales proposals, often
    used to automate agreement workflows.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/document_cloud
  terms:
  - literal: Document Generation API
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/acrobat_sign_api
  label: Adobe Acrobat Sign API
  description: Acrobat Sign's REST API for creating and managing agreements, embedding signing and retrieving signed
    documents in applications.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/document_cloud
  terms:
  - literal: Acrobat Sign API
    term_type: short_form
    term_status: admitted
  - literal: Acrobat Sign REST API
    term_type: full_form
    term_status: admitted
  - literal: Adobe Sign API
    term_type: full_form
    term_status: superseded
- id: coe:entity/adobe/pdf_extract_api
  label: Adobe PDF Extract API
  description: Adobe PDF Extract API is an Acrobat Services API that uses machine learning to unlock unstructured content
    in PDFs by extracting text, complex tables, images, figures, and document structure into structured data (such as JSON)
    for analytics, AI, and downstream processing, offered alongside Adobe PDF Services API within Acrobat Services.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/document_cloud
  terms:
  - literal: PDF Extract API
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/pdf_accessibility_auto_tag_api
  label: Adobe PDF Accessibility Auto-Tag API
  description: Adobe PDF Accessibility Auto-Tag API is an Acrobat Services API that uses AI to automatically tag PDFs for
    accessibility—headings, reading order, and structure—and can generate a detailed accessibility report, available as part
    of the Acrobat Services family and through Adobe PDF Services integrations.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/document_cloud
  terms:
  - literal: PDF Accessibility Auto-Tag API
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/pdf_electronic_seal_api
  label: Adobe PDF Electronic Seal API
  description: Adobe PDF Electronic Seal API is an Acrobat Services API that applies a tamper-evident electronic seal to PDFs
    at scale using certificates from trust service providers on Adobe's Approved Trust List (AATL), helping verify document
    identity and integrity for invoices, financial statements, and other regulated workflows, and is included with the PDF
    Services API.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/document_cloud
  terms:
  - literal: PDF Electronic Seal API
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/cascade_contractai_api
  label: Adobe Acrobat Analyzer API
  description: Analyzer in Acrobat Studio is a GenAI document-intelligence capability for Acrobat and Acrobat Sign that provides
    REST APIs to upload contracts and other documents, extract structured, cited attributes (such as terms and clauses), search
    and filter across large collections, and integrate those insights into enterprise workflows.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/document_cloud
  terms:
  - literal: Analyzer API
    term_type: short_form
    term_status: admitted
  - literal: Project Cascade
    term_type: codename
    term_status: admitted
