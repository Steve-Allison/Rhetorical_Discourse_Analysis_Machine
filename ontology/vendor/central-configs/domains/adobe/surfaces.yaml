- id: coe:entity/adobe/acrobat_mobile
  label: Adobe Acrobat (Mobile)
  description: The mobile surface of Acrobat for reading, annotating, filling and signing PDFs on phones and tablets.
  home_domain: adobe
  status: canonical
  surface_of: coe:entity/adobe/acrobat
  surface_form: mobile
  terms:
