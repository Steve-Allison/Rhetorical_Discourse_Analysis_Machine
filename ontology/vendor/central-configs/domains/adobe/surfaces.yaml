    term_type: short_form
    term_status: admitted
  - literal: Adobe Acrobat Reader mobile app
    term_type: full_form
    term_status: admitted
- id: coe:entity/adobe/photoshop_web
  label: Adobe Photoshop (web)
  description: Photoshop on the web is a browser-based version of Photoshop that lets you open cloud documents and edit images
    with many of Photoshop's most common tools and generative AI capabilities, directly in Chrome, Edge, or Firefox, without
    installing the desktop app.
  home_domain: adobe
  status: canonical
  surface_of: coe:entity/adobe/photoshop
  surface_form: web
- id: coe:entity/adobe/illustrator_web
  label: Adobe Illustrator (web)
  description: Illustrator on the web (Beta) is a browser-based Illustrator experience that lets you create and edit vector
    graphics using essential shape, path, typography, color, and collaboration tools, working with Creative Cloud-synced documents
    from anywhere.
  home_domain: adobe
  status: canonical
  surface_of: coe:entity/adobe/illustrator
  surface_form: web
- id: coe:entity/adobe/lightroom_web
  label: Adobe Lightroom (web)
  description: The browser surface of Lightroom for viewing, culling and editing synced photos from any machine.
  home_domain: adobe
  status: canonical
  surface_of: coe:entity/adobe/lightroom
  surface_form: web
- id: coe:entity/adobe/premiere_mobile
  label: Adobe Premiere (Mobile)
  description: The mobile surface of Premiere for editing and publishing video on phones and tablets with the Premiere
    editing model in a touch-first form.
  home_domain: adobe
  status: canonical
  surface_of: coe:entity/adobe/premiere_pro
  surface_form: mobile
