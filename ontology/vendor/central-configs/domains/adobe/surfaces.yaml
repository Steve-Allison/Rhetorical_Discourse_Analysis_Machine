- id: coe:entity/adobe/acrobat_desktop
  label: Adobe Acrobat (Desktop)
  description: The desktop surface of Acrobat — the installed application for PDF creation, editing, signing and review on
    Windows and macOS.
  home_domain: adobe
  status: canonical
  surface_of: coe:entity/adobe/acrobat
  surface_form: desktop
- id: coe:entity/adobe/acrobat_web
  label: Adobe Acrobat (Web)
  description: The browser surface of Acrobat for viewing, editing, converting and signing PDFs without an install.
  home_domain: adobe
  status: canonical
  surface_of: coe:entity/adobe/acrobat
  surface_form: web
