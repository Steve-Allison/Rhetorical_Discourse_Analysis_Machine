_meta:
  file_id: coe:file/domain/adobe/agents
  title: Adobe — Agents
  last_updated: '2026-10-18'
  authority: Central_Configs
  scope: domain
  ontology_domain: adobe
  governing_class: coe:DomainModule
module_id: coe:module/adobe/agents
domain: adobe
agents:
- id: coe:entity/adobe/account_qualification_agent
  label: Account Qualification Agent
  description: Account Qualification Agent, delivered through the Sales Qualifier add-on for Journey Optimizer B2B Edition,
    uses AI to synthesize account and buying-group intelligence, generate personalized outreach, and autonomously prioritize
    and engage prospects so BDRs focus on the most promising opportunities while CRM data is kept up to date.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/sales_qualifier
  families:
  - coe:entity/adobe/customer_engagement
  - coe:entity/adobe/cx_enterprise_agents
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/audience_agent
  label: Audience Agent
  description: Adobe's audience-management agent in Real-Time CDP and Journey Optimizer that lets practitioners explore,
    understand and manage audiences in natural language — surfacing inventory, detecting size changes and duplicates, and
    retrieving audience sizes.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/experience_platform
  - coe:entity/adobe/real_time_cdp
  - coe:entity/adobe/journey_optimizer
  - coe:entity/adobe/customer_journey_analytics
  families:
  - coe:entity/adobe/customer_engagement
  - coe:entity/adobe/cx_enterprise_agents
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/content_production_agent
  label: Content Production Agent
  description: Content Production Agent in GenStudio for Performance Marketing is a conversational, on-brand content-production
    agent that takes teams from brief to multi-asset content and activation, streamlining ideation, evaluation and generation
    of campaign-ready emails, ads and other assets while enforcing brand alignment.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/content_supply_chain_solution
  - coe:entity/adobe/cx_enterprise_agents
  available_in:
  - coe:entity/adobe/genstudio_for_performance_marketing
  orchestrated_by: coe:entity/adobe/agent_orchestrator
  serves_stage:
  - coe:entity/adobe/creation_production
- id: coe:entity/adobe/data_insights_agent
  label: Data Insights Agent
  description: Adobe's analytics agent in Customer Journey Analytics that answers plain-language questions about the data
    and builds the matching visualisations and tables, grounded in the organisation's configured data views.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/customer_engagement
  - coe:entity/adobe/cx_enterprise_agents
  available_in:
  - coe:entity/adobe/customer_journey_analytics
  orchestrated_by: coe:entity/adobe/agent_orchestrator
  serves_stage:
  - coe:entity/adobe/reporting_insights
- id: coe:entity/adobe/data_engineering_agent
  label: Data Engineering Agent
  description: Data Engineering Agent is an Experience Platform data-management agent that accelerates onboarding and ongoing
    data operations by helping define schemas and mappings, orchestrate ingestion, and run AI-powered data validation and
    quality checks across fields and datasets to improve decision-making.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/experience_platform
  - coe:entity/adobe/customer_journey_analytics
  families:
  - coe:entity/adobe/cx_enterprise_agents
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/experimentation_agent
  label: Experimentation Agent
  description: Experimentation Agent in Journey Optimizer Experimentation Accelerator centralizes past and active experiments,
    summarizes results by audience, analyzes why certain creatives and treatments win, attributes performance to key factors,
    and proposes new high-impact tests and opportunities, including workflows that integrate with Adobe Target.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/customer_engagement
  - coe:entity/adobe/cx_enterprise_agents
  available_in:
  - coe:entity/adobe/journey_optimizer_experimentation_accelerator
  orchestrated_by: coe:entity/adobe/agent_orchestrator
  serves_stage:
  - coe:entity/adobe/delivery_activation
- id: coe:entity/adobe/journey_agent
  label: Journey Agent
  description: Adobe's journey-orchestration agent in Journey Optimizer that builds journeys from natural-language prompts,
    analyses fallout, detects scheduling and audience conflicts and proposes adjustments before publication.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/customer_engagement
  - coe:entity/adobe/cx_enterprise_agents
  available_in:
  - coe:entity/adobe/journey_optimizer
  - coe:entity/adobe/journey_optimizer_b2b_edition
  orchestrated_by: coe:entity/adobe/agent_orchestrator
  serves_stage:
  - coe:entity/adobe/delivery_activation
- id: coe:entity/adobe/workflow_optimization_agent
  label: Workflow Optimization Agent
  description: Workflow Optimization Agent is an AI-powered workflow intelligence agent in Adobe Workfront that boosts team
    productivity by automatically monitoring project health, surfacing risks and priorities, and recommending smarter ways
    to organize and progress work.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/content_supply_chain_solution
  - coe:entity/adobe/cx_enterprise_agents
  available_in:
  - coe:entity/adobe/workfront
  orchestrated_by: coe:entity/adobe/agent_orchestrator
  serves_stage:
  - coe:entity/adobe/workflows_planning_metadata
- id: coe:entity/adobe/product_advisor_agent
  label: Product Advisor Agent
  description: Adobe's product-recommendation agent in Brand Concierge that advises end customers in real time, using
    unified profiles, behavioural data and business rules to recommend products, plans or offers.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/brand_visibility
  available_in:
  - coe:entity/adobe/brand_concierge
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/site_optimization_agent
  label: Site Optimization Agent
  description: Site Optimization Agent is the GenAI-first agent behind Adobe Experience Manager Sites Optimizer that automatically
    diagnoses issues in site performance, traffic acquisition, and content engagement, then generates prescriptive code and
    content suggestions and can auto-implement approved fixes to improve business outcomes.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/brand_visibility
  available_in:
  - coe:entity/adobe/experience_manager_sites_optimizer
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/brand_experience_agent
  label: Brand Experience Agent
  description: Brand Experience Agent in Adobe Experience Manager automates high-effort, high-volume experience work by combining
    Experience Modernization (site migration to cloud-ready Edge Delivery Services), Experience Production (content and forms
    updates and communications), and Development Agent (Cloud Manager pipeline troubleshooting and operational support) so
    brands can modernize, update, and troubleshoot digital experiences faster with less manual effort.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/cx_enterprise_agents
  available_in:
  - coe:entity/adobe/experience_manager
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/content_advisor_agent
  label: Content Advisor Agent
  description: Content Advisor Agent is Adobe's AI content-discovery and optimization agent that helps teams quickly find
    the right assets, content fragments, forms, and pages across AEM using natural-language prompts, and can generate channel-ready
    image variations from source assets to accelerate campaigns and reuse across Adobe and non-Adobe applications.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/experience_manager
  families:
  - coe:entity/adobe/cx_enterprise_agents
  orchestrated_by: coe:entity/adobe/agent_orchestrator
  serves_stage:
  - coe:entity/adobe/asset_management
- id: coe:entity/adobe/brand_governance_agent
  label: Brand Governance Agent
  description: Brand Governance/Governance Agent in Adobe Experience Manager safeguards brand integrity and compliance by
    automatically checking content, assets, and pages against brand and customer policies and by managing permissions and
    DRM, enforcing security, regulatory, and usage rules so experiences remain on-brand and compliant at scale.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/cx_enterprise_agents
  available_in:
  - coe:entity/adobe/experience_manager_sites
  - coe:entity/adobe/experience_manager_assets
  orchestrated_by: coe:entity/adobe/agent_orchestrator
  serves_stage:
  - coe:entity/adobe/asset_management
- id: coe:entity/adobe/product_support_agent
  label: Product Support Agent
  description: Product Support Agent is the CX Enterprise agent surfaced through AI Assistant in Real-Time CDP, Adobe Journey
    Optimizer, Customer Journey Analytics, and AEM, helping users troubleshoot product issues in-context, create support tickets,
    and track case progress without leaving their workflows.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/customer_engagement
  - coe:entity/adobe/cx_enterprise_agents
  available_in:
  - coe:entity/adobe/experience_platform
  - coe:entity/adobe/real_time_cdp
  - coe:entity/adobe/journey_optimizer
  - coe:entity/adobe/customer_journey_analytics
  - coe:entity/adobe/experience_manager
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/llm_optimization_agent
  label: LLM Optimization Agent
  description: Adobe Brand Visibility (formerly LLM Optimizer) is a generative AI-first application for Generative Engine
    Optimization that helps brands understand how they show up in AI-generated answers, track brand presence, agentic and
    referral traffic, and use prescriptive content recommendations and automated fixes (including Optimize at Edge) to improve
    visibility, accuracy, and influence in AI-driven search.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/brand_visibility
  available_in:
  - coe:entity/adobe/llm_optimizer
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/cx_enterprise_coworker
  label: Adobe CX Enterprise Coworker
  description: Adobe CX Enterprise Coworker is the persistent, goal-oriented agentic engine for CX Enterprise that turns business
    objectives into multi-step workflows across Real-Time CDP, Journey Optimizer, AEM, Workfront, and other systems, planning,
    executing, and validating the work with approvals, governance, long-term memory, and business context so teams can automate
    customer-experience workflows end-to-end.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/cx_enterprise
  - coe:entity/adobe/adobe_ai_platform
  available_in:
  - coe:entity/adobe/experience_platform
  - coe:entity/adobe/real_time_cdp
  - coe:entity/adobe/customer_journey_analytics
  - coe:entity/adobe/journey_optimizer
  terms:
  - literal: CX Enterprise Coworker
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/experience_production_agent
  label: Experience Production Agent
  description: Experience Production Agent is Adobe's production-focused AEM agent within Brand Experience Agent that automates
    high-effort, high-volume updates across sites and forms—updating existing pages, content fragments, and forms and creating
    new forms and communications—so teams can keep experiences current without rebuilding content manually.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/cx_enterprise_agents
  available_in:
  - coe:entity/adobe/experience_manager_sites
  - coe:entity/adobe/experience_manager_assets
  - coe:entity/adobe/experience_manager_forms
- id: coe:entity/adobe/experience_modernization_agent
  label: Experience Modernization Agent
  description: Experience Modernization Agent is Adobe's AI development and site-migration agent for Adobe Experience Manager
    Edge Delivery Services that onboards existing websites by automating site creation and migration, mapping pages to blocks,
    extracting design patterns, and generating Edge Delivery code, with the self-service Experience Modernization Console
    and AOE delivery model supporting ongoing block development and complex, production-ready migrations.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/experience_manager_sites
  - coe:entity/adobe/experience_manager_edge_delivery_services
  families:
  - coe:entity/adobe/cx_enterprise_agents
- id: coe:entity/adobe/development_agent
  label: Development Agent
  description: Development Agent is Adobe's AEM developer agent within Brand Experience Agent that helps traditional AEM Java-stack
    developers and administrators create, debug, deploy, and optimize code by managing Cloud Manager pipelines, analyzing
    failed build steps and logs to suggest fixes, configuring quiet hours and update-free periods, and troubleshooting replication
    issues such as blocked queues—all through AI Assistant.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/cx_enterprise_agents
  available_in:
  - coe:entity/adobe/experience_manager
- id: coe:entity/adobe/firefly_ai_assistant
  label: Firefly AI Assistant
  description: Firefly AI Assistant is Adobe's agentic creative orchestration layer—a conversational interface that understands
    what a creator wants to make, plans multi-step workflows across Firefly, Creative Cloud and partner generative models,
    then executes them while keeping assets editable in Firefly Boards and apps like Photoshop, Illustrator and Premiere.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/firefly
  families:
  - coe:entity/adobe/creative_cloud
- id: coe:entity/adobe/marketing_agent
  label: Adobe Marketing Agent
  description: Adobe Marketing Agent is an Experience Platform agent that surfaces Operational Insights, Customer Journey
    Analytics data insights, Audience Agent and Journey Agent capabilities directly inside Microsoft 365 Copilot, so marketers
    can ask natural-language questions about audiences, journeys and campaign performance in Teams, Word, PowerPoint and Excel
    without leaving their flow of work.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/experience_platform
  - coe:entity/adobe/real_time_cdp
  - coe:entity/adobe/journey_optimizer
  - coe:entity/adobe/customer_journey_analytics
  families:
  - coe:entity/adobe/cx_enterprise
  - coe:entity/adobe/cx_enterprise_agents
  terms:
  - literal: Adobe Marketing Agent for Microsoft 365 Copilot
    term_type: full_form
    term_status: admitted
- id: coe:entity/adobe/merchant_productivity_agent
  label: Merchant Productivity Agent
  description: Merchant Productivity Agent is an AI-powered assistant in Adobe Commerce that helps merchants operate, optimize
    and grow their business by using natural-language prompts to run merchandising and operational tasks, explore store and
    catalog data, surface opportunities or risks, and execute agentic actions across commerce workflows.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/brand_visibility
  available_in:
  - coe:entity/adobe/commerce
- id: coe:entity/adobe/productivity_agent
  label: Adobe Productivity Agent
  description: Adobe's productivity agent brings decades of Acrobat document intelligence into a single agentic interface
    that uses AI planning and tool orchestration to answer questions, power conversational PDF editing, and generate images,
    text and rich content like presentations, podcasts and social posts. It also underpins PDF Spaces, turning static files
    into interactive, branded experiences with tailored AI assistants, audio overviews and engagement insights.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/acrobat
  - coe:entity/adobe/express
- id: coe:entity/adobe/loyalty_agent
  label: Loyalty Agent
  description: Loyalty Agent is an AI-powered assistant in Adobe Journey Optimizer Loyalty that lets marketers manage loyalty
    challenges and analyze program performance via natural language—surfacing KPIs, anomalies and next-best recommendations
    and, over time, supporting challenge creation, editing and orchestration through Agent Orchestrator.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/journey_optimizer_loyalty
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/aem_onboarding_agent
  label: AEM Onboarding Agent
  description: AEM Onboarding Agent is an Agent Orchestrator-powered onboarding capability for Experience Manager Assets,
    accessible via Coworker Chat and AI Assistant, that guides users through end-to-end DAM setup by orchestrating skills
    to propose and create folder hierarchies, tag taxonomies and metadata schemas and to configure bulk imports and search.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/cx_enterprise_agents
  available_in:
  - coe:entity/adobe/experience_manager_assets
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/content_discovery_agent
  label: Content Discovery Agent
  description: Content Discovery Agent is part of AEM's Content Advisor Agent and delivers unified conversational discovery
    across Assets, Content Fragments, Sites pages and Adaptive Forms, using natural-language prompts to return curated, approved
    content with metadata and Dynamic Media delivery URLs ready for reuse in other applications.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/cx_enterprise_agents
  available_in:
  - coe:entity/adobe/experience_manager
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/content_optimization_agent
  label: Content Optimization Agent
  description: Content Optimization Agent is an AEM-focused Experience Platform agent within Content Advisor that interprets
    natural-language intent to prepare and adapt images and video for different channels—generating optimized renditions via
    Dynamic Media and returning ready-to-use delivery URLs for web, mobile, email, social and other experiences.
  home_domain: adobe
  status: canonical
  families:
  - coe:entity/adobe/cx_enterprise_agents
  available_in:
  - coe:entity/adobe/experience_manager
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/field_discovery_agent
  label: Field Discovery Agent
  description: Field Discovery Agent is an AI-powered agent in Adobe Experience Platform that, both directly in AI Assistant
    and behind the scenes for agents such as Audience and Data Engineering, uses natural-language queries to return ranked
    XDM field suggestions with sample values, schema location and usage context to support segmentation, querying and other
    data workflows.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/experience_platform
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/operational_insights_agent
  label: Operational Insights Agent
  description: Operational Insights Agent is an Experience Platform agentic capability that exposes operational metrics and
    anomaly detection across audiences, datasets, schemas, destinations and journeys in AI Assistant, and is invoked by other
    agents such as Audience, Journey and Data Engineering to provide practitioners with fast, conversational operational insight.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/experience_platform
  - coe:entity/adobe/real_time_cdp
  - coe:entity/adobe/journey_optimizer
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/time_series_agent
  label: Time Series Agent
  description: Adobe's time-series analysis agent within Audience Agent that answers natural-language questions about historical
    audience sizes, comparing current sizes to past values and flagging audiences whose size has changed significantly over
    configurable periods.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/real_time_cdp
  - coe:entity/adobe/journey_optimizer
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/product_knowledge_agent
  label: Product Knowledge Agent
  description: Adobe's product-knowledge question-answering agent that powers AI Assistant and other applications by answering
    how-to and conceptual questions about Adobe products using Experience League and other official documentation, returning
    grounded, cited responses.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/experience_platform
  orchestrated_by: coe:entity/adobe/agent_orchestrator
