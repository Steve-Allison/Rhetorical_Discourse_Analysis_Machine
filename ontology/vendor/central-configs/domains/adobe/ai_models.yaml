ai_models:
- id: coe:entity/adobe/firefly_video_model
  label: Firefly Video Model
  description: The Firefly generative video model that provides commercially safe text-to-video and image-to-video creation
    in the Firefly web app, trained only on content Adobe has permission to use—such as Adobe Stock and public-domain content
    where copyright has expired—and never on customer content.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
- id: coe:entity/adobe/firefly_custom_models
  label: Adobe Firefly Custom Models
  description: Enterprise Firefly models trained on an organisation's own approved images—capturing brand styles, products,
    and characters—to generate on-brand text-to-image content in Adobe Firefly, Adobe Express, and Adobe GenStudio, with each
    custom model kept private to the organisation and not used to train Adobe's foundational Firefly models.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/creative_cloud
