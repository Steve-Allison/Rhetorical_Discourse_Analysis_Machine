_meta:
  file_id: coe:file/domain/adobe/organisation
  title: Adobe — Organisation and Product Families
  last_updated: '2026-10-18'
  authority: Central_Configs
  scope: domain
  ontology_domain: adobe
  governing_class: coe:DomainModule
module_id: coe:module/adobe/organisation
domain: adobe
organisations:
- id: coe:entity/adobe/adobe
  label: Adobe
  description: Adobe is a global software company whose products are organized primarily into Creative Cloud, Experience Cloud,
    and Document Cloud, alongside a Publishing and Advertising portfolio and an AI layer (including Adobe Firefly) that powers
    features across these clouds.
  home_domain: adobe
  status: canonical
  terms:
  - literal: Adobe Inc.
    term_type: full_form
    term_status: admitted
business_units:
- id: coe:entity/adobe/customer_experience_orchestration
  label: Customer Experience Orchestration
  description: Customer Experience Orchestration (CXO) is Adobe's enterprise business unit formerly known as Digital Experience,
    responsible for Adobe Experience Cloud and Adobe Experience Platform and focused on end-to-end customer-experience and
    marketing solutions for businesses.
  home_domain: adobe
  status: canonical
  unit_of: coe:entity/adobe/adobe
  terms:
  - literal: CXO
    term_type: initialism
    term_status: admitted
- id: coe:entity/adobe/creativity_productivity
  label: Creativity & Productivity
  description: Creativity & Productivity (C&P), formerly Digital Media, is Adobe's business unit for Creative Cloud, Document
    Cloud, and 3D & immersive solutions such as Substance 3D and Aero, serving creators, business professionals, and consumers.
  home_domain: adobe
  status: canonical
  unit_of: coe:entity/adobe/adobe
  terms:
- id: coe:entity/adobe/digital_advertising_learning_publishing
  label: Digital Advertising, Learning & Publishing
  description: Digital Advertising, Learning & Publishing (D-ALP), formerly the Print & Publishing Business Unit, is Adobe's
    business unit for digital learning, technical communication, web-conferencing, and advertising products including Adobe
    Captivate, Adobe Learning Manager, Adobe Connect, Technical Communication Suite, and Adobe Advertising.
  home_domain: adobe
  status: canonical
  unit_of: coe:entity/adobe/adobe
  terms:
  - literal: Print & Publishing Business Unit
    term_type: full_form
    term_status: superseded
  - literal: PPBU
    term_type: initialism
    term_status: superseded
product_families:
- id: coe:entity/adobe/experience_cloud
  label: Adobe Experience Cloud
  description: Adobe Experience Cloud is Adobe's integrated portfolio of applications and services for understanding customers,
    managing content, and orchestrating journeys—organized into Content & Commerce, Data Insights & Audiences, Customer Journeys,
    and Marketing Workflow, all built on Adobe Experience Platform.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  terms:
  - literal: Experience Cloud
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/cx_enterprise
  label: Adobe CX Enterprise
  description: Adobe CX Enterprise is Adobe's unified, agentic system and commercial framing for its customer-experience portfolio,
    replacing Adobe Experience Cloud in market and organizing Brand Visibility, Customer Engagement, and Content Supply Chain
    solutions on Adobe Experience Platform and Agent Orchestrator without introducing a new SKU.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  terms:
  - literal: CX Enterprise
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/creative_cloud
  label: Adobe Creative Cloud
  description: Adobe's product family of creative applications and services for image, video, design, illustration, 3D
    and audio work, licensed as a subscription.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/content_supply_chain_solution
  terms:
  - literal: Creative Cloud
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/document_cloud
  label: Adobe Document Cloud
  description: Adobe Document Cloud is Adobe's portfolio for digital document productivity—creating, editing, reviewing, signing,
    and scanning PDFs—centered on Acrobat, Acrobat Sign, mobile apps like Adobe Scan, and cloud-based PDF services and integrations.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  terms:
  - literal: Document Cloud
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/substance_3d
  label: Adobe Substance 3D
  description: Adobe Substance 3D is Adobe's 3D design suite—including Painter, Designer, Sampler, Stager, and Modeler—for
    authoring materials, texturing and staging 3D scenes, and rendering realistic visuals, offered under Adobe's Creative
    Cloud 3D & AR plans.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/creative_cloud
  terms:
  - literal: S3D
    term_type: product_code
    term_status: admitted
- id: coe:entity/adobe/genstudio
  label: Adobe GenStudio
  description: Adobe GenStudio is Adobe's generative-AI-first content supply chain platform, with GenStudio for Performance
    Marketing providing an end-to-end pipeline to plan, create, activate, and measure on-brand marketing content, built on
    integrations with Workfront, Experience Manager Assets, Firefly/Express, Content Analytics, and Adobe Experience Platform.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/experience_cloud
  - coe:entity/adobe/content_supply_chain_solution
  terms:
  - literal: GenStudio
    term_type: short_form
    term_status: admitted
    usage_note: Here the product family. The same name also refers to the GenStudio application that a customer opens.
- id: coe:entity/adobe/content_and_commerce
  label: Content & Commerce
  description: Adobe Experience Cloud's product category for managing and delivering content and commerce experiences —
    content management, digital asset management, forms, signage, technical documentation, storefronts and learning.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/experience_cloud
- id: coe:entity/adobe/data_insights_and_audiences
  label: Data Insights & Audiences
  description: Adobe Experience Cloud's product category for collecting and analysing customer data and building the
    audiences activated from it — analytics, customer data platform, audience management, measurement and advertising.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/experience_cloud
  terms:
  - literal: Data Insights & Activation
    term_type: full_form
    term_status: admitted
- id: coe:entity/adobe/customer_journeys
  label: Customer Journeys
  description: Adobe Experience Cloud's product category for orchestrating and personalising customer engagement —
    journeys, campaigns, testing and personalisation, and marketing automation.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/experience_cloud
- id: coe:entity/adobe/marketing_workflow
  label: Marketing Workflow
  description: Adobe Experience Cloud's product category for planning and managing marketing work — projects, workflows,
    approvals and resourcing.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/experience_cloud
  terms:
  - literal: Marketing Planning & Workflow
    term_type: full_form
    term_status: admitted
- id: coe:entity/adobe/customer_engagement
  label: Customer Engagement
  description: CX Enterprise's pillar for orchestrating the customer lifecycle — journey orchestration, audience management,
    decisioning and analytics — on Experience Platform and its applications.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/cx_enterprise
- id: coe:entity/adobe/brand_visibility
  label: Brand Visibility
  description: CX Enterprise's pillar for making a brand visible, trusted and chosen across AI surfaces and owned channels,
    and for optimising web experiences for both human and agentic traffic.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/cx_enterprise
- id: coe:entity/adobe/content_supply_chain_solution
  label: Content Supply Chain
  description: CX Enterprise's pillar of a unified platform on GenStudio for planning, creating, managing, activating and
    measuring content at scale, from a foundational to an agentic content supply chain.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/cx_enterprise
- id: coe:entity/adobe/ai_first_applications
  label: AI-first applications
  description: In CX Enterprise, AI-first applications are purpose-built products that embed generative and agentic AI directly
    into their workflows, drawing on Experience Platform Agents via Agent Orchestrator; they are packaged and licensed as
    distinct applications or capabilities depending on the specific product.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/adobe_ai_platform
  terms:
  - literal: Agent-based Applications
    term_type: full_form
    term_status: admitted
- id: coe:entity/adobe/cx_enterprise_agents
  label: CX Enterprise Agents
  description: The group of purpose-built AI agents that live inside existing CX Enterprise applications, are reached
    through Agent Orchestrator and draw on AI credits.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  families:
  - coe:entity/adobe/adobe_ai_platform
- id: coe:entity/adobe/adobe_ai_platform
  label: Adobe AI Platform
  description: Adobe AI Platform is the foundation that powers CX Enterprise, bringing together Adobe Experience Platform,
    Agent Orchestrator, Experience Platform Agents, AI-first applications, CX Enterprise Coworker, CX language models, and
    trust, privacy, security, and governance services.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
- id: coe:entity/adobe/sensei
  label: Adobe Sensei
  description: Adobe's brand for the machine-intelligence capabilities embedded across Creative Cloud, Document Cloud and
    Experience Cloud — auto-tagging, subject selection, personalisation scoring and anomaly detection — rather than a
    product sold on its own.
  home_domain: adobe
  status: canonical
  vendor: coe:entity/adobe/adobe
  terms:
  - literal: Sensei
    term_type: short_form
    term_status: admitted
    usage_note: A coined name that identifies Adobe Sensei in Adobe context; sensei is also the Japanese word for teacher.
