_meta:
  file_id: coe:file/domain/adobe/capabilities
  title: Adobe — Capabilities
  last_updated: '2026-10-18'
  authority: Central_Configs
  scope: domain
  ontology_domain: adobe
  governing_class: coe:DomainModule
module_id: coe:module/adobe/capabilities
domain: adobe
capabilities:
- id: coe:entity/adobe/agent_orchestrator
  label: Adobe Experience Platform Agent Orchestrator
  description: Adobe Experience Platform Agent Orchestrator is the agentic AI layer in Experience Platform that interprets
    natural-language goals, reasons through them, and coordinates purpose-built Adobe agents—deciding which to use, in what
    order, and how to combine their results. It works across Experience Cloud applications via interfaces like AI Assistant
    while inheriting Experience Platform's unified profiles, real-time data, and governance controls.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  families:
  - coe:entity/adobe/adobe_ai_platform
  terms:
  - literal: Agent Orchestrator
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/ai_assistant
  label: AI Assistant
  description: AI Assistant is a generative-AI conversational interface embedded in Adobe Experience Platform and CX Enterprise
    applications such as Real-Time CDP, Journey Optimizer, Customer Journey Analytics, AEM, Target, and Workfront, where it
    answers product and operational questions in natural language. It also fronts specialized agents (for example Audience
    Agent, Journey Agent, Product Support Agent and Data Insights Agent), allowing users to trigger agentic workflows through
    a single assistant.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  - coe:entity/adobe/real_time_cdp
  - coe:entity/adobe/journey_optimizer
  - coe:entity/adobe/customer_journey_analytics
  - coe:entity/adobe/experience_manager
- id: coe:entity/adobe/audience_ai
  label: AI Assistant for Audiences
  description: 'In Adobe Real-Time CDP, AI Assistant for Audiences and the Audience Agent provide AI-driven audience capabilities:
    using natural language, marketers can estimate audience size, monitor and explain significant audience-size changes, forecast
    audience growth, and define goal-oriented audiences. These audience insights and forecasting features are surfaced through
    AI Assistant and grounded in Real-Time CDP''s audience data and governance.'
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  - coe:entity/adobe/real_time_cdp
  supports_practice:
  - coe:entity/business/audience_segmentation
  terms:
  - literal: Audience AI
    term_type: full_form
    term_status: deprecated
- id: coe:entity/adobe/sensei_genai
  label: Sensei GenAI
  description: Adobe Sensei GenAI is the generative-AI service layer in Adobe Experience Cloud that uses large language models
    and Firefly-compatible models to power features such as content generation in Adobe Journey Optimizer and Generate Variations
    and other genAI tools in Adobe Experience Manager Sites and Assets. These services create on-brand marketing copy, images,
    and content variants from prompts and context, and are exposed through product-specific genAI experiences and AI Assistant.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/journey_optimizer
  - coe:entity/adobe/experience_manager
  families:
  - coe:entity/adobe/sensei
- id: coe:entity/adobe/generative_fill
  label: Generative Fill
  description: Generative Fill in Photoshop is a non-destructive generative-AI feature that lets you replace or add content
    inside a selection using a text prompt or automatic context-based fill, synthesizing new pixels that blend with the surrounding
    image. It supports Firefly and partner models (such as FLUX and Gemini) so generated content matches the scene's lighting,
    perspective, and texture.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/photoshop
- id: coe:entity/adobe/generative_expand
  label: Generative Expand
  description: Photoshop's Firefly-powered capability that extends an image beyond its original borders, generating
    matching content to fill the enlarged canvas.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/photoshop
- id: coe:entity/adobe/content_aware_fill
  label: Content Aware Fill
  description: The Photoshop and After Effects capability that fills a removed region by synthesising from the surrounding
    pixels of the same image — sampling the image itself rather than a generative model.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/photoshop
  - coe:entity/adobe/after_effects
- id: coe:entity/adobe/creative_cloud_libraries
  label: Creative Cloud Libraries
  description: Creative Cloud Libraries are cloud-based shared libraries of design assets—such as colors, color themes, character
    styles, graphics, text, brushes, and logos—that keep brand elements consistent across apps like Photoshop, Illustrator,
    InDesign, XD, Capture, and even Microsoft Office. They support linked assets and collaboration so edits to a library item
    update everywhere it's used, helping teams maintain consistent design across projects.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/photoshop
  - coe:entity/adobe/illustrator
  - coe:entity/adobe/indesign
  - coe:entity/adobe/capture
  families:
  - coe:entity/adobe/creative_cloud
- id: coe:entity/adobe/real_time_customer_profile
  label: Adobe Real-Time Customer Profile
  description: Real-Time Customer Profile merges data from multiple online and offline sources into unified, actionable customer
    profiles that include both attributes and time-series events, updating in near real time. These profiles, built on identity
    graphs and governed data, power segmentation, Real-Time CDP audiences, journeys, and activation across channels.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Real-Time Customer Profile
    term_type: short_form
    term_status: admitted
  - literal: Unified Profile Service
    term_type: full_form
    term_status: admitted
  - literal: UPS
    term_type: initialism
    term_status: admitted
- id: coe:entity/adobe/identity_graph
  label: Identity graph in Adobe Experience Platform
  description: Identity Graph in Adobe Experience Platform Identity Service is a near-real-time map of relationships between
    stitched identities—such as device IDs, hashed emails, and CRM IDs—within a private graph per organization. It bridges
    fragmented identifiers across devices and systems so Real-Time Customer Profile, using merge policies and governance rules,
    can assemble comprehensive views of each customer.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Identity Graph
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/data_governance
  label: Data Governance
  description: Adobe Experience Platform Data Governance is a service and framework of data usage labels, usage policies,
    and policy enforcement that lets you classify data at connection, dataset, and field level and control which marketing
    actions on that data are allowed, automatically detecting and preventing policy-violating activations and other data operations.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
- id: coe:entity/adobe/experience_platform_edge_network
  label: Adobe Experience Platform Edge Network
  description: Adobe Experience Platform Edge Network is a globally distributed, fast routing network that receives XDM event
    data from Web SDK, Mobile SDK, and the Edge Network Server API and, via datastreams, distributes it in product-specific
    formats to Adobe applications and other destinations, underpinning client-side tags, server-side event forwarding, and
    real-time experiences such as decisioning.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Edge Network
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/experience_platform_data_collection
  label: Adobe Experience Platform Data Collection
  description: Adobe Experience Platform Data Collection is the family of data-capture and routing technologies—including
    Web and Mobile SDKs, Tags, Datastreams, Event Forwarding, the Edge Network Server API, Assurance, and Debugger—for collecting
    event data client- and server-side into the Edge Network and sending it on to Adobe and non-Adobe destinations.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Data Collection
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/tags
  label: Tags in Adobe Experience Platform
  description: Experience Platform's tag-management capability — client-side rules, data elements and extensions with
    development, staging and production environments and a publishing workflow for deploying data-collection and
    marketing technologies.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Experience Platform Launch
    term_type: full_form
    term_status: superseded
- id: coe:entity/adobe/event_forwarding
  label: Event forwarding in Adobe Experience Platform
  description: Adobe Experience Platform Event Forwarding is the server-side data collection capability that runs rules on
    events received by the Edge Network to transform and enrich them, then forwards the resulting data to non-Adobe and other
    destinations without adding client-side weight or changing existing implementations.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Event Forwarding
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/datastreams
  label: Datastreams in Adobe Experience Platform
  description: Adobe Experience Platform Datastreams are Edge Network configurations that specify which Experience Cloud applications
    (such as Adobe Experience Platform, Analytics, Target, and Journey Optimizer) and event-forwarding endpoints receive each
    incoming payload and how that data is handled and stored in each product.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
- id: coe:entity/adobe/offer_decisioning
  label: Offer Decisioning
  description: Offer Decisioning is an application service integrated with Adobe Experience Platform and Adobe Journey Optimizer
    that uses a centralized offer library and a decision engine driven by Real-Time Customer Profile data to select the best
    offer for each customer across touchpoints, with decisions and related events exported into Adobe Experience Platform
    datasets for analysis and batch delivery.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  - coe:entity/adobe/journey_optimizer
  terms:
  - literal: Offer Management
    term_type: full_form
    term_status: superseded
  - literal: Adobe Experience Platform Decisioning Services
    term_type: full_form
    term_status: admitted
- id: coe:entity/adobe/content_fragments
  label: Content Fragments in Adobe Experience Manager
  description: Experience Manager's structured, presentation-independent content authored against a content model and
    delivered through APIs, including GraphQL, to any channel — the unit of headless content.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_manager
  terms:
  - literal: Content Fragments
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/experience_fragments
  label: Experience Fragments in Adobe Experience Manager
  description: Experience Manager's reusable groups of components with layout — a complete piece of an experience placed
    across pages and channels so the same composed content is maintained once.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_manager
  terms:
  - literal: Experience Fragments
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/pdf_spaces
  label: PDF Spaces
  description: PDF Spaces is an AI-powered workspace in Acrobat Studio where you bring together up to 100 files, links, notes,
    audio and text summaries, and an AI Assistant into a single conversational knowledge hub, then share it as a custom guided
    experience with citation-backed question answering and generative outputs such as podcasts and presentations.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/acrobat_studio
  terms:
  - literal: Acrobat PDF Spaces
    term_type: full_form
    term_status: admitted
- id: coe:entity/adobe/pdf_spaces_sharing
  label: PDF Spaces Sharing
  description: PDF Spaces Sharing in Acrobat Studio lets you share an AI-powered workspace that bundles files, notes, audio
    overviews, insights, and an AI Assistant into a single guided experience instead of multiple attachments. Collaborators
    can work in the same space with controlled permissions, branded layouts, and engagement tracking (views, shares, time
    spent).
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/acrobat_studio
- id: coe:entity/adobe/acrobat_generate_presentation
  label: Acrobat Generate Presentation
  description: Generate Presentation in Acrobat Studio uses generative AI and Adobe Express Premium to turn prompts and source
    documents into polished, multi-slide presentations with narrative flow, professional layouts, and on-brand styling. Users
    can customize decks with Adobe Stock assets, charts, and media, then share and co-edit within the Acrobat/Express workspace.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/acrobat_studio
  terms:
  - literal: Generate Presentation
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/audio_overview
  label: Audio Overview
  description: In Acrobat's PDF Spaces, Audio Overview is an AI-generated spoken summary block used in shared spaces to let
    recipients listen to key highlights of the documents instead of reading, as part of a guided experience alongside files,
    notes, and the AI Assistant.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/acrobat
- id: coe:entity/adobe/generate_podcast
  label: Generate Podcast
  description: 'Generate Podcast (Acrobat Podcast) turns document or PDF Space content into AI-generated, two-host conversational
    podcasts in two formats: a shorter Highlights podcast (~6 minutes) and a longer Deep Dive podcast (~12 minutes). Users
    can generate and play these podcasts across Acrobat desktop, web, and mobile to review reports and complex topics on the
    go.'
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/acrobat
- id: coe:entity/adobe/brand_intelligence
  label: Adobe Brand Intelligence
  description: Adobe Brand Intelligence is GenStudio for Performance Marketing's governance and validation layer that evaluates
    human-created and AI-generated content against brand guidelines, channel rules, accessibility, and legal/regulatory standards,
    assigning compliance scores and flagging issues. It also powers skills like Validate and Instruct to Assemble/Adapt to
    assemble and adapt on-brand content variants at scale using continuously updated brand rules and feedback.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/genstudio_for_performance_marketing
  - coe:entity/adobe/genstudio_foundation
  - coe:entity/adobe/genstudio_for_content_marketing
  - coe:entity/adobe/genstudio_for_commerce_media_networks
  families:
  - coe:entity/adobe/genstudio
  - coe:entity/adobe/content_supply_chain_solution
  serves_stage:
  - coe:entity/adobe/asset_management
  terms:
  - literal: Brand Intelligence
    term_type: short_form
    term_status: admitted
    usage_note: Here the GenStudio capability for brand governance and validation. The same name also refers to the Brand Intelligence pillar of the Agentic Content Supply Chain.
- id: coe:entity/adobe/student_spaces
  label: Student Spaces in Acrobat
  description: Student Spaces in Acrobat is a free, AI-powered study workspace on Acrobat web and Android where students organize
    up to 100 files per space and turn course materials into flashcards, quizzes, study guides, mind maps/cheat sheets, audio
    summaries, podcasts, video summaries, and presentations, all backed by citations. A built-in AI tutor helps explain concepts,
    and students can share spaces with classmates to collaborate on group projects, with premium tools like Podcast, Presentation,
    and Video Summary unlocked via a free Adobe account.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/acrobat
  terms:
  - literal: Acrobat Student Spaces
    term_type: full_form
    term_status: admitted
  - literal: Student Spaces
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/acrobat_online_services
  label: Acrobat Online Services
  description: Acrobat Online Services refers to the cloud-connected Document Cloud capabilities—Acrobat web and mobile, online
    PDF tools, storage, PDF Spaces, Generate Presentation, and related Express/AI integrations—whose availability is controlled
    by the PDF Services setting in the Admin Console product profile. This entitlement is separate from the developer-facing
    PDF Services API and can be disabled while still allowing some local AI Assistant use on desktop/mobile.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/acrobat
- id: coe:entity/adobe/pdf_properties
  label: PDF Properties
  description: The PDF Properties operation in the PDF Services API retrieves comprehensive PDF metadata and properties—including
    page count, PDF version, encryption and permission details, compliance levels (PDF/A, PDF/X, PDF/UA, etc.), fonts, XMP
    and Info dictionary fields, and optional page-level content/structure (images, text, scanned pages, tagging). It is exposed
    as pdfproperties in the PDF Services API and surfaced in tools like the Adobe PDF Services connector ("Get PDF Properties")
    in Power Automate.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/pdf_services_api
- id: coe:entity/adobe/pdf_form_data
  label: Import/Export PDF Form Data
  description: The Import PDF Form Data and Export PDF Form Data operations in the PDF Services API let developers programmatically
    read form field values from, and write them into, interactive PDF forms (AcroForm and static XFA) at scale. Export returns
    field data as structured JSON or CSV key-value pairs (and can emit an empty schema from a blank form), while Import takes
    the same formats to pre-populate forms, with dynamic XFA forms rejected by design.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/pdf_services_api
- id: coe:entity/adobe/pdf_watermark
  label: PDF Watermark
  description: The PDF Watermark operation in the PDF Services API adds a watermark to a PDF by applying a supplied watermark
    document (typically a single-page PDF or image) across selected pages, with controls for page ranges, front- vs back-placement,
    positioning, rotation, and opacity. Text-only watermark options are planned and may not be available in all SDKs or deployments,
    so the capability should be described as document/image-based watermarking rather than guaranteed text watermark support.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/pdf_services_api
- id: coe:entity/adobe/identity_service
  label: Adobe Experience Platform Identity Service
  description: Adobe Experience Platform Identity Service is the identity service that uses identity namespaces and identity
    graphs to bridge customer identifiers across devices and systems; its identity graphs are leveraged by Real-Time Customer
    Profile to stitch disparate profile fragments into unified profiles, and it is distinct from the Experience Cloud ID/Visitor
    ID Service.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Identity Service
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/experience_cloud_id
  label: Experience Cloud ID Service
  description: Experience Cloud ID Service (ECID) is an Experience Cloud identity service and tag extension that sets a common
    visitor identifier across Adobe Experience Cloud solutions; ECID values can be ingested into Adobe Experience Platform
    and used as one of the identifiers in the identity graph, but the service itself is not a native Adobe Experience Platform
    capability.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/visitor_id_service
  - coe:entity/adobe/web_sdk
  terms:
  - literal: Experience Cloud ID
    term_type: short_form
    term_status: admitted
  - literal: ECID
    term_type: initialism
    term_status: admitted
- id: coe:entity/adobe/data_lake
  label: Data Lake in Adobe Experience Platform
  description: The Adobe Experience Platform data lake is the primary data repository where all successfully ingested data
    is persisted as datasets, serving as both a staging area and long-term storage to support analytics, data science, Query
    Service, and downstream services such as Real-Time Customer Profile and activation.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Data Lake
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/catalog_service
  label: Catalog Service in Adobe Experience Platform
  description: Experience Platform's system of record for dataset metadata, lineage and location that other platform
    services read to find data.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Catalog Service
    term_type: short_form
    term_status: admitted
  - literal: Data Catalog Service
    term_type: full_form
    term_status: admitted
- id: coe:entity/adobe/datasets
  label: Datasets in Adobe Experience Platform
  description: In Adobe Experience Platform, a dataset is a storage and management construct in the data lake—typically a
    table with an XDM schema, rows, and metadata—that serves as the core unit of data persistence and is consumed by services
    such as Real-Time Customer Profile, Identity Service, Query Service, segmentation, and Destinations when the dataset is
    appropriately configured (for example, enabled for profile).
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
- id: coe:entity/adobe/query_service
  label: Adobe Experience Platform Query Service
  description: Experience Platform's SQL engine over Data Lake datasets, whose results can become new datasets for
    reporting, machine learning or Profile ingestion.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Query Service
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/data_prep
  label: Data Prep in Adobe Experience Platform
  description: Adobe Experience Platform Data Prep is the mapping and transformation layer used in the ingestion process that
    lets data engineers map, transform, and validate source data to and from Experience Data Model (XDM) before it is written
    into datasets and used by downstream services.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Data Prep
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/schema_registry
  label: Schema Registry in Adobe Experience Platform
  description: Adobe Experience Platform Schema Registry is the XDM modeling service that provides a UI (Schema Editor) and
    REST API to define and manage classes, schemas, field groups, and data types; customer experience data, including profiles
    and identities, is stored in datasets that conform to these XDM schemas.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  conforms_to:
  - coe:entity/adobe/experience_data_model
  terms:
  - literal: Schema Registry
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/privacy_service
  label: Privacy Service in Adobe Experience Platform
  description: Adobe Experience Platform Privacy Service provides a RESTful API and user interface to submit and orchestrate
    privacy access, delete, and opt-out requests across Adobe Experience Cloud applications; it relies on Identity Service
    identity namespaces (including ECID and other identifiers) to locate and process the relevant data in Experience Platform's
    data lake and Profile store.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Privacy Service
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/destinations
  label: Adobe Experience Platform Destinations Service
  description: Destinations in Adobe Experience Platform and Real-Time Customer Data Platform are pre-built integrations with
    downstream platforms (including advertising, email, cloud storage, analytics, social, and mobile) that seamlessly activate
    known and unknown audience and profile data from Real-Time Customer Profile, enforcing Data Governance labels and policies
    on what data can be exported.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  - coe:entity/adobe/real_time_cdp
- id: coe:entity/adobe/sources
  label: Sources in Adobe Experience Platform
  description: Sources are Adobe Experience Platform's connectors that ingest data from Adobe, first-party, and third-party
    applications—including cloud storage, databases, CRM systems, and streaming sources—into Platform's data lake and Real-Time
    Customer Profile.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
- id: coe:entity/adobe/dataflows
  label: Dataflows in Adobe Experience Platform
  description: Dataflows are Flow Service–backed representations of data jobs that move data across Adobe Experience Platform—from
    source connectors into target datasets, through Identity Service and Real-Time Customer Profile, and out to destinations—while
    providing configurable orchestration and end-to-end monitoring.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Flow Service
    term_type: full_form
    term_status: admitted
- id: coe:entity/adobe/decisioning_service
  label: Decisioning Service in Adobe Experience Platform
  description: Adobe's decisioning capability, delivered through Journey Optimizer, uses a central library of marketing offers
    and a decision engine that applies eligibility rules and ranking strategies against Real-Time Customer Profiles to select
    the best offer or experience in real time for channels such as email, web, mobile, and API-based experiences.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Decisioning Service
    term_type: short_form
    term_status: admitted
  - literal: Experience Decisioning
    term_type: full_form
    term_status: admitted
- id: coe:entity/adobe/edge_profile
  label: Experience Platform Edge Profile
  description: Edge profiles are lightweight projections of Real-Time Customer Profile replicated to the Adobe Experience
    Platform Edge Network via edge projections, providing high-throughput, low-latency access to profile attributes and audiences
    for real-time web and mobile personalization and offer decisioning.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/experience_platform
  terms:
  - literal: Edge Profile
    term_type: short_form
    term_status: admitted
  - literal: Projection Service
    term_type: full_form
    term_status: admitted
  - literal: Express Profile
    term_type: short_form
    term_status: admitted
  - literal: Edge Profile Lookup Service
    term_type: full_form
    term_status: superseded
- id: coe:entity/adobe/places_service
  label: Adobe Experience Platform Location Service
  description: Places Service is a geo-location service with a flexible database of points of interest (POIs) and rich metadata,
    plus mobile SDK extensions and Launch rules that let apps act on entry and exit events and geo-attributes to drive real-time,
    location-aware targeting and personalization across Adobe Experience Cloud solutions.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/mobile_sdk
  terms:
  - literal: Places Service
    term_type: full_form
    term_status: superseded
  - literal: Adobe Experience Platform Places
    term_type: full_form
    term_status: superseded
- id: coe:entity/adobe/fill_and_sign
  label: Fill & Sign
  description: Fill & Sign is a Document Cloud tool that lets you fill in PDF forms and add your own signature and initials,
    available in Acrobat on desktop and web, Acrobat Reader, and a standalone mobile app; in Acrobat you can also route forms
    to others for e-signatures using related e-sign tools.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/acrobat
- id: coe:entity/adobe/compress_pdf
  label: Compress PDF
  description: Compress PDF is an Acrobat Document Cloud tool that reduces PDF file size using configurable compression levels,
    available both as an online service and through "Compress PDF" and "Optimize PDF" actions in Acrobat desktop and web.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/acrobat
- id: coe:entity/adobe/protect_pdf
  label: Protect PDF
  description: Protect PDF is an Acrobat capability that lets you control who can open a PDF and what they can do with it
    by applying passwords or certificates, setting printing, copying, and editing permissions, and using 256-bit AES encryption,
    available as an online tool and within Acrobat.
  home_domain: adobe
  status: canonical
  capability_of:
