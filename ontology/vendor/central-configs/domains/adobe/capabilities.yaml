- id: coe:entity/adobe/analytics_for_advertising
  label: Analytics for Advertising
  description: Analytics for Advertising is a bi-directional integration between Adobe Advertising (DSP, Search, Social, &
    Commerce) and Adobe Analytics that sends onsite engagement and conversion data into Adobe Advertising for optimization,
    while returning impression, click, and cost data to Analytics for unified reporting. When combined with Customer Journey
    Analytics, the same data powers cross-channel visualizations and journey analysis in CJA.
