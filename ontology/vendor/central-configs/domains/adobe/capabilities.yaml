- id: coe:entity/adobe/chatgpt_ads
  label: ChatGPT Ads
  description: ChatGPT Ads in GenStudio for Performance Marketing lets marketers generate on-brand ChatGPT ad variants, run
    built-in brand and channel checks, route them through review and approval, and then publish them to OpenAI Ads Manager
    in an off state so media teams control final go-live inside ChatGPT Ads Manager.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/genstudio_for_performance_marketing
- id: coe:entity/adobe/ctv_ads
  label: CTV Ads
  description: CTV Ads in GenStudio for Performance Marketing provide a generative-AI, scene-based workflow to create on-brand
    connected TV spots, including AI-generated scenes, music, and voiceover, refine them, and export publisher-ready CTV video
    that can be saved to Content and used in downstream CTV buying and activation workflows.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/genstudio_for_performance_marketing
- id: coe:entity/adobe/openai_ads_integration
  label: OpenAI Ads Integration
  description: OpenAI Ads Integration onboards OpenAI Ads—the ChatGPT conversational ad format—as a new publisher in Adobe
    Advertising Search, Social, & Commerce for consolidated campaign management and reporting alongside other publishers,
