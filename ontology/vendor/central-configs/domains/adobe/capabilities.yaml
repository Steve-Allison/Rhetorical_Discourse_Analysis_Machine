- id: coe:entity/adobe/acrobat_legal_templates
  label: Acrobat Legal Templates
  description: Acrobat Legal Templates are curated, guided templates for common legal documents—such as NDAs, non-compete
    agreements, and other contracts—available to specific paid Acrobat plans and integrated into Acrobat's signing workflows
    to help users quickly draft and complete long-form agreements.
  home_domain: adobe
  status: canonical
  capability_of:
  - coe:entity/adobe/acrobat
