editions:
- id: coe:entity/adobe/journey_optimizer_b2b_edition
  label: Adobe Journey Optimizer B2B Edition
  description: Adobe Journey Optimizer B2B Edition is the buying-group-aware edition of Journey Optimizer that uses Adobe
    Experience Platform and Real-Time CDP B2B data to orchestrate account and person journeys for B2B, managing buying groups
    and activating coordinated engagement—including actions that integrate with Marketo Engage.
  home_domain: adobe
  status: canonical
  edition_of: coe:entity/adobe/journey_optimizer
  supports_practice:
  - coe:entity/business/journey_orchestration
  terms:
  - literal: AJO B2B
    term_type: initialism
    term_status: admitted
- id: coe:entity/adobe/real_time_cdp_b2b_edition
  label: Adobe Real-Time CDP B2B Edition
  description: The B2B edition of Real-Time CDP — unifying person and account profiles and linking leads to accounts and
    opportunities for account-based segmentation and activation.
  home_domain: adobe
  status: canonical
  edition_of: coe:entity/adobe/real_time_cdp
  terms:
  - literal: RTCDP B2B
    term_type: initialism
    term_status: admitted
  - literal: RTCDP B2B Edition
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/customer_journey_analytics_b2b_edition
  label: Adobe Customer Journey Analytics B2B Edition
  description: The B2B edition of Customer Journey Analytics — account-level journey analysis that rolls person activity up
    to buying groups and accounts.
  home_domain: adobe
  status: canonical
  edition_of: coe:entity/adobe/customer_journey_analytics
  terms:
  - literal: CJA B2B
    term_type: initialism
    term_status: admitted
  - literal: CJA B2B Edition
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/commerce_as_a_cloud_service
  label: Adobe Commerce as a Cloud Service
  description: Adobe Commerce as a Cloud Service is the fully managed SaaS edition of Adobe Commerce, where Adobe operates
    the core application and infrastructure, delivers continuous updates, and merchants extend functionality through APIs
    and Adobe Developer App Builder; its default storefront is powered by Edge Delivery Services, with optional headless deployments
    using third-party storefronts.
  home_domain: adobe
  status: canonical
  edition_of: coe:entity/adobe/commerce
- id: coe:entity/adobe/acrobat_express
  label: Adobe Acrobat Express
  description: Adobe Acrobat Express is a subscription offering for business professionals that brings together Acrobat AI
    Assistant, PDF Spaces, core PDF tools (create, convert, export, protect, compress), and Adobe Express Premium in an English-only,
    AI-powered workspace (Acrobat Express home) available across desktop, web, and mobile.
  home_domain: adobe
  status: canonical
  edition_of: coe:entity/adobe/acrobat
  terms:
  - literal: Acrobat Express
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/acrobat_reader
  label: Adobe Acrobat Reader
  description: The free edition of Acrobat for reading, commenting on, filling and signing PDFs without paid Acrobat
    features.
  home_domain: adobe
  status: canonical
  edition_of: coe:entity/adobe/acrobat
  terms:
  - literal: Acrobat Reader
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/acrobat_standard
  label: Adobe Acrobat Standard
  description: Adobe Acrobat Standard is the Windows-only essentials edition of Acrobat that lets users create, edit, convert,
    and sign PDFs, offering a subset of Acrobat Pro capabilities for organizations that don't need the full advanced toolset.
  home_domain: adobe
  status: canonical
  edition_of: coe:entity/adobe/acrobat
  terms:
  - literal: Acrobat Standard
    term_type: short_form
    term_status: admitted
- id: coe:entity/adobe/acrobat_pro
  label: Adobe Acrobat Pro
  description: The full edition of Acrobat for creating, editing, converting, protecting, signing and exporting PDFs.
  home_domain: adobe
  status: canonical
  edition_of: coe:entity/adobe/acrobat
  families:
  - coe:entity/adobe/creative_cloud
- id: coe:entity/adobe/acrobat_studio
  label: Adobe Acrobat Studio
  description: Adobe Acrobat Studio is Adobe's all-in-one content and document platform that combines Acrobat Pro (for advanced
    PDF editing and e-signatures), Acrobat AI Assistant and PDF Spaces (for document insight and collaboration), and Adobe
    Express Premium (for branded content creation), so teams can manage, understand, and create content in one place.
  home_domain: adobe
  status: canonical
  edition_of: coe:entity/adobe/acrobat
  terms:
  - literal: Acrobat Studio
    term_type: short_form
    term_status: admitted
