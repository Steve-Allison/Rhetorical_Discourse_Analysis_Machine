_meta:
  file_id: coe:file/domain/adobe/frameworks
  title: Adobe — Frameworks
  last_updated: '2026-10-18'
  authority: Central_Configs
  scope: domain
  ontology_domain: adobe
  governing_class: coe:DomainModule
module_id: coe:module/adobe/frameworks
domain: adobe
frameworks:
- id: coe:entity/adobe/content_supply_chain
  label: Content Supply Chain
  description: Adobe's Content Supply Chain is an end-to-end business process for marketing campaigns and personalized experiences,
    framed as five building blocks—Workflow & Planning, Creation & Production, Asset Management, Delivery & Activation, and
    Reporting & Insights—that connect strategy, execution, and measurement and focus on streamlining, governing, and optimizing
    enterprise content operations.
  home_domain: adobe
  status: canonical
  anti_examples:
  - supply chain logistics
- id: coe:entity/adobe/agentic_content_supply_chain
  label: Agentic Content Supply Chain
  description: The Agentic Content Supply Chain is Adobe's domain layer and workflow/data model for automating the end-to-end
    marketing content lifecycle—intake, planning, creative production, activation, and measurement—across any organization,
    running on CX Enterprise Coworker as the AI agent runtime and orchestration engine, with human guardrails for compliance
    and high-risk decisions.
  home_domain: adobe
  status: canonical
framework_stages:
- id: coe:entity/adobe/workflows_planning_metadata
  label: Workflow & Planning
  description: Workflow & Planning is the first Content Supply Chain phase, where campaign strategy is translated into structured
    work—defining audiences, journeys, channels, briefs, plans, calendars, budgets, and KPIs so content creation is aligned
    with business goals from the outset.
  home_domain: adobe
  status: canonical
  stage_of: coe:entity/adobe/content_supply_chain
  stage_order: 1
  terms:
  - literal: Workflow and Planning
    term_type: full_form
    term_status: admitted
- id: coe:entity/adobe/creation_production
  label: Creation & Production
  description: Creation & Production is the second Content Supply Chain phase, where content ideas become actual assets—copy,
    design, video, templates, and modular components—produced at scale (increasingly with generative AI) so they can be adapted
    and reused across channels and experiences.
  home_domain: adobe
  status: canonical
  stage_of: coe:entity/adobe/content_supply_chain
  stage_order: 2
- id: coe:entity/adobe/asset_management
  label: Asset Management
  description: Asset Management is the third Content Supply Chain phase, where content is reviewed and approved for brand,
    legal, and accessibility standards, then stored, organized, and tagged in a DAM with rights and renditions so teams can
    discover, reuse, and distribute approved assets efficiently.
  home_domain: adobe
  status: canonical
  stage_of: coe:entity/adobe/content_supply_chain
  stage_order: 3
- id: coe:entity/adobe/delivery_activation
  label: Delivery & Activation
  description: The Content Supply Chain stage in which approved content is published and activated across channels and
    campaigns.
  home_domain: adobe
  status: canonical
  stage_of: coe:entity/adobe/content_supply_chain
  stage_order: 4
  terms:
  - literal: Delivery and Activation
    term_type: full_form
    term_status: admitted
- id: coe:entity/adobe/reporting_insights
  label: Reporting & Insights
  description: The Content Supply Chain stage in which content and campaign performance is measured and fed back into
    planning.
  home_domain: adobe
  status: canonical
  stage_of: coe:entity/adobe/content_supply_chain
  stage_order: 5
  terms:
  - literal: Reporting and Insights
    term_type: full_form
    term_status: admitted
- id: coe:entity/adobe/enterprise_context
  label: Enterprise Context
  description: Enterprise Context is the Agentic Content Supply Chain pillar that provides the unified campaign/program context—briefs,
    structured metadata, hierarchy, and audience/journey definitions—that agent workflows read and write so every action is
    grounded in a consistent marketing context.
  home_domain: adobe
  status: canonical
  stage_of: coe:entity/adobe/agentic_content_supply_chain
- id: coe:entity/adobe/agentic_brand_intelligence
  label: Brand Intelligence
  description: Brand Intelligence is the Agentic Content Supply Chain pillar that encodes brand standards and safety constraints—tone,
    visual and copy rules, compliance policies, and performance learnings—so agents can generate and select content that stays
    on-brand and within human-defined guardrails.
  home_domain: adobe
  status: canonical
  stage_of: coe:entity/adobe/agentic_content_supply_chain
- id: coe:entity/adobe/ai_workflows
  label: AI Workflows
  description: AI Workflows is the Agentic Content Supply Chain pillar that defines reusable, agent-powered workflow playbooks
    across the full content lifecycle—intake, planning, creation, approvals, activation, and measurement—so marketing motions
    can run as consistent, automated production lines.
  home_domain: adobe
  status: canonical
  stage_of: coe:entity/adobe/agentic_content_supply_chain
- id: coe:entity/adobe/agentic_orchestration
  label: Agentic Orchestration
  description: Agentic Orchestration is the Agentic Content Supply Chain pillar where CX Enterprise Coworker's orchestration
    engine and agent runtime coordinate when and how agents execute workflow steps across production lines, enforcing sequencing,
    handoffs, and guardrails.
  home_domain: adobe
  status: canonical
  stage_of: coe:entity/adobe/agentic_content_supply_chain
- id: coe:entity/adobe/conversational_experience
  label: Conversational Experience
  description: Conversational Experience is the Agentic Content Supply Chain pillar that provides the hybrid, conversational
    UI—across GenStudio and CX Enterprise Coworker surfaces—through which people direct agents, review work, and collaborate
    with the automated content supply chain.
  home_domain: adobe
  status: canonical
  stage_of: coe:entity/adobe/agentic_content_supply_chain
