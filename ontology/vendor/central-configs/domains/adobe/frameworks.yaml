domain: adobe
frameworks:
- id: coe:entity/adobe/content_supply_chain
  label: Content Supply Chain
  description: Adobe's model of enterprise content operations as an end-to-end chain of five phases, from planning work
    through producing, managing, activating and measuring marketing content.
  home_domain: adobe
  status: canonical
  terms:
  - literal: CSC
    term_type: initialism
    term_status: admitted
  anti_examples:
  - supply chain logistics
- id: coe:entity/adobe/agentic_content_supply_chain
  label: Agentic Content Supply Chain
  description: Adobe's evolution of the Content Supply Chain on GenStudio into one AI-orchestrated system of repeatable
    production lines for each marketing motion, in which AI agents plan, produce, route, review and optimise while people
    set direction.
  home_domain: adobe
  status: canonical
framework_stages:
- id: coe:entity/adobe/workflows_planning_metadata
  label: Workflow & Planning
  description: The Content Supply Chain phase that turns strategy into structured work — briefs, plans, calendars and KPIs.
  home_domain: adobe
  status: canonical
  stage_of: coe:entity/adobe/content_supply_chain
  stage_order: 1
  terms:
  - literal: Workflow and Planning
    term_type: full_form
    term_status: admitted
  - literal: Workflows, Planning & Metadata
    term_type: full_form
    term_status: superseded
- id: coe:entity/adobe/creation_production
  label: Creation & Production
  description: The Content Supply Chain stage in which creative assets are authored and produced at scale.
  home_domain: adobe
  status: canonical
  stage_of: coe:entity/adobe/content_supply_chain
  stage_order: 2
- id: coe:entity/adobe/asset_management
  label: Asset Management
  description: The Content Supply Chain phase in which assets are governed, approved, stored and distributed.
  home_domain: adobe
  status: canonical
  stage_of: coe:entity/adobe/content_supply_chain
  stage_order: 3
- id: coe:entity/adobe/delivery_activation
  label: Delivery & Activation
  description: The Content Supply Chain stage in which approved content is published and activated across channels and
    campaigns.
  home_domain: adobe
  status: canonical
  stage_of: coe:entity/adobe/content_supply_chain
  stage_order: 4
  terms:
  - literal: Delivery and Activation
    term_type: full_form
    term_status: admitted
- id: coe:entity/adobe/reporting_insights
  label: Reporting & Insights
  description: The Content Supply Chain stage in which content and campaign performance is measured and fed back into
