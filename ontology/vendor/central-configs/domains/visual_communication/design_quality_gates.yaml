- dimensions:
  - weight: 0.25
    id: coe:artifact/visual_communication/video_multimedia_rubric/dimension/audio_clarity
    label: Audio Clarity
    description: Evaluates voice quality, background noise floor, volume consistency, articulation clarity, and compression/EQ
      treatment. Crisp audio is the single highest-leverage production variable for learner engagement.
    home_domain: visual_communication
    status: canonical
    evidence_ids: *id001
  - weight: 0.2
    id: coe:artifact/visual_communication/video_multimedia_rubric/dimension/visual_narration_sync
    label: Visual-Narration Synchronisation
    description: Evaluates temporal alignment of visuals with speech, spatial placement of on-screen text relative to corresponding
      graphics, verbal-visual channel balance, and signalling cues that direct learner attention. Directly maps to Mayer's
      temporal contiguity (effect size 1.30) and spatial contiguity (effect size 0.82) principles.
    home_domain: visual_communication
    status: canonical
    evidence_ids: *id001
  - weight: 0.2
    id: coe:artifact/visual_communication/video_multimedia_rubric/dimension/segment_pacing
    label: Segment Pacing
    description: Evaluates video segment lengths against engagement research, information density per minute, learner cognitive
      load management, and presence of reflection pause cues. Guo et al. (2014) found median engagement time is 6 minutes;
      Brame (2016) recommends ≤6 min for concept videos.
    home_domain: visual_communication
    status: canonical
    evidence_ids: *id001
  - weight: 0.15
    id: coe:artifact/visual_communication/video_multimedia_rubric/dimension/transition_quality
    label: Transition Quality
    description: Evaluates scene-to-scene cut quality, topic transition signposting, visual continuity across angles and backgrounds,
      and use of B-roll or cutaways to maintain coherence. Research shows establishing shots before transitions reduce cognitive
      load; consistent transition style creates predictable mental checkpoints.
    home_domain: visual_communication
    status: canonical
    evidence_ids: *id001
  - weight: 0.2
    id: coe:artifact/visual_communication/video_multimedia_rubric/dimension/production_value
    label: Production Value
    description: 'Evaluates technical output quality: video resolution, camera framing, lighting quality, graphics fidelity,
      and brand consistency. High production value signals credibility and maintains learner attention.'
    home_domain: visual_communication
    status: canonical
    evidence_ids: *id001
  thresholds:
  - key: audio_integrated_lufs
    label: Integrated Loudness
    description: Integrated programme loudness of the finished video's audio; the streaming-platform standard band, with the
      target at the centre of it.
    unit: LUFS
    minimum_value: -18
    target_value: -16
    maximum_value: -14
  - key: audio_noise_floor_dbfs
    label: Audio Noise Floor
    description: Background noise level of the narration bed. The target is broadcast-quality; anything above the maximum
      stops qualifying as acceptable room tone.
    unit: dBFS
    target_value: -60
    maximum_value: -50
  - key: audio_noise_floor_failure_dbfs
    label: Audio Noise Floor Failure Ceiling
    description: Hard ceiling for background noise; above this level the audio_noise_unacceptable penalty applies and the
      audio must be re-recorded or denoised.
    unit: dBFS
    maximum_value: -40
  - key: narration_words_per_minute
    label: Narration Pace
    description: Speaking rate of recorded narration; the band in which comprehension and engagement are both maintained for
      instructional video.
    unit: words per minute
    minimum_value: 120
    maximum_value: 150
  - key: narration_words_per_minute_warning
    label: Narration Pace Warning Band
    description: Outer warning band for narration pace; outside these bounds the narration is flagged as too slow or too fast
      even before hard failure.
    unit: words per minute
    minimum_value: 90
    maximum_value: 165
  - key: concept_segment_max_minutes
    label: Concept Segment Length
    description: Maximum length of a single-concept video segment; concept videos hold engagement only when kept this short.
    unit: minutes
    maximum_value: 3
  - key: module_segment_max_minutes
    label: Module Segment Length
    description: Maximum length of a module-level video segment, per Guo et al. (2014) median engagement of six minutes and
      Brame (2016).
    unit: minutes
    maximum_value: 6
  - key: walkthrough_segment_max_minutes
    label: Walkthrough Segment Length
    description: Maximum length of a hands-on walkthrough segment, where task-following sustains engagement longer than concept
      exposition.
    unit: minutes
    maximum_value: 10
  - key: cut_frequency_seconds
    label: Cut Frequency
    description: Interval between visual cuts or camera changes; cuts faster than the minimum feel frantic, slower than the
      maximum reads as static single-camera footage.
    unit: seconds
    minimum_value: 8
    maximum_value: 15
  - key: bullet_hold_duration_seconds
    label: Bullet Hold Duration
    description: Time an on-screen bullet remains visible after its reveal; long enough to read, short enough not to stall
      the narration.
    unit: seconds
    minimum_value: 3
    maximum_value: 6
  - key: caption_accuracy_min_percent
    label: Caption Accuracy
    description: Minimum word-level accuracy of closed captions against the spoken narration.
    unit: percent
    minimum_value: 99
  - key: caption_sync_tolerance_seconds
    label: Caption Sync Tolerance
    description: Maximum offset between caption display and the corresponding speech.
    unit: seconds
    maximum_value: 0.5
  - key: caption_max_characters_per_line
    label: Caption Line Length
    description: Maximum characters per caption line, following broadcast captioning practice.
    unit: characters
    maximum_value: 42
  - key: caption_max_lines_on_screen
    label: Caption Lines On Screen
    description: Maximum simultaneous caption lines; more occludes the picture and slows reading.
    unit: lines
    maximum_value: 2
  - key: visual_sync_tolerance_seconds
    label: Visual-Narration Sync Tolerance
    description: Maximum acceptable offset between narration and the visual it references, per Mayer's temporal contiguity
      principle.
    unit: seconds
    maximum_value: 1.0
  - key: visual_sync_failure_seconds
    label: Visual-Narration Sync Failure
    description: Hard ceiling for narration-visual offset; beyond this the audio_visual_mismatch penalty applies.
    unit: seconds
    maximum_value: 2.0
  - key: resolution_min_pixels_height
    label: Minimum Resolution
    description: Minimum vertical resolution of the delivered video; below 1080 lines the sub_1080p_resolution penalty applies.
    unit: pixels
    minimum_value: 1080
  - key: b_roll_min_percent_of_runtime
    label: B-Roll Share of Runtime
    description: Minimum share of runtime covered by B-roll or cutaways, maintaining visual continuity and masking edits.
    unit: percent
    minimum_value: 15
  - key: lower_third_duration_seconds
    label: Lower-Third Duration
    description: Display time for lower-third name or title graphics; long enough to read twice.
    unit: seconds
    target_value: 4
  - key: mayer_critical_principles_required
    label: Mayer Critical Principles Required
    description: Minimum count of Mayer's critical multimedia principles (coherence, signalling, redundancy, contiguity) that
      must be demonstrably met.
    unit: principles
    minimum_value: 4
  - key: on_screen_text_max_words_per_overlay
    label: On-Screen Text Per Overlay
    description: Maximum words in a single on-screen text overlay; more re-creates the redundancy effect against narration.
    unit: words
    maximum_value: 8
  - key: max_animated_elements_simultaneous
    label: Simultaneous Animated Elements
    description: Maximum elements animating at once; more splits attention and exceeds working-memory capacity.
    unit: elements
    maximum_value: 3
  last_updated: '2026-09-01'
