_meta:
  file_id: coe:file/domain/visual_communication/design_quality_gates
  title: Visual Communication — Design Quality Gates
  last_updated: '2026-09-01'
  authority: Central_Configs
  scope: domain
  ontology_domain: visual_communication
  governing_class: coe:DomainModule
module_id: coe:module/visual_communication/design_quality_gates
domain: visual_communication
scoring_models:
- dimensions:
  - weight: 0.25
    id: coe:artifact/visual_communication/data_visualisation_rubric/dimension/chart_type_appropriateness
    label: Chart Type Appropriateness
    description: 'Degree to which the selected chart type matches the analytical task (lookup, comparison, trend, composition,
      correlation, distribution). Based on Vessey''s Cognitive Fit Theory: performance is maximised only when the visual representation
      aligns with the task the viewer must perform.'
    home_domain: visual_communication
    status: canonical
    evidence_ids: &id001
    - coe:source/central-configs-legacy-f6eb98ff
    - coe:decision/v4-migration/visual_communication/design_quality_gates
    - coe:source/legacy-file/b1d39aa30588112c
    - coe:source/legacy-file/c74fa337caf6512b
  - weight: 0.2
    id: coe:artifact/visual_communication/data_visualisation_rubric/dimension/data_ink_ratio
    label: Data-Ink Ratio
    description: 'Proportion of visual ink actually encoding data versus total ink in the graphic. Target ratio >= 0.85. Chartjunk
      (3D effects, decorative fills, heavy gridlines, moiré patterns, redundant tick marks, background fills) is extraneous
      cognitive load and must be eliminated. Formula: Data-Ink / Total Ink used to print the graphic.'
    home_domain: visual_communication
    status: canonical
    evidence_ids: *id001
  - weight: 0.2
    id: coe:artifact/visual_communication/data_visualisation_rubric/dimension/labelling_clarity
    label: Labelling Clarity
    description: Quality of axis labels, data labels, title informativeness, and absence of separate legends requiring lookup.
      Direct labelling eliminates the split-attention effect where the viewer must split gaze between a legend and the data
      series to decode colour mapping. Titles must state the analytical conclusion (action caption), not merely describe the
      subject.
    home_domain: visual_communication
    status: canonical
    evidence_ids: *id001
  - weight: 0.15
    id: coe:artifact/visual_communication/data_visualisation_rubric/dimension/colour_accessibility
    label: Colour Accessibility
    description: 'Use of colorblind-safe palettes, adequate contrast ratios for chart elements (WCAG 2.1 AA: 3:1 for non-text
      graphics), and avoidance of colour as the sole encoding channel. Approximately 8% of males have colour vision deficiency;
      red-green combinations are the most common failure mode. Redundant encoding (colour + shape/pattern/label) is required
      for accessible charts.'
    home_domain: visual_communication
    status: canonical
    evidence_ids: *id001
  - weight: 0.2
    id: coe:artifact/visual_communication/data_visualisation_rubric/dimension/insight_communication
    label: Insight Communication
    description: Degree to which the chart's title and annotations communicate the key analytical conclusion rather than merely
      labelling the subject matter. A Topic Title ('Q4 Revenue') forces the viewer to analyse and conclude. An Action Caption
      ('Q4 Revenue Grew 15%, Driven by the Premium Segment') transfers the conclusion instantly, reducing cognitive load and
      increasing decision-making speed. Annotation quality and key takeaway visibility are also assessed.
    home_domain: visual_communication
    status: canonical
    evidence_ids: *id001
  thresholds:
  - key: data_ink_ratio
    label: Data-Ink Ratio
    description: Proportion of ink encoding data versus total ink in the graphic (Tufte 1983). Below the minimum the chart
      carries moderate-to-severe chartjunk; at or above the target all non-data ink is eliminated.
    unit: ratio
    minimum_value: 0.6
    target_value: 0.85
  - key: data_ink_ratio_critical_fail
    label: Data-Ink Ratio Critical Floor
    description: Hard floor for estimated data-ink ratio. Below this value multiple chartjunk categories dominate the visual
      field and the composite score is capped at the severe-chartjunk level.
    unit: ratio
    minimum_value: 0.4
  - key: colour_contrast_normal_text
    label: Colour Contrast — Normal Text
    description: Minimum contrast ratio for chart text below 18pt (or 14pt bold) against its background, per WCAG 2.1 AA 1.4.3.
    unit: contrast ratio (x:1)
    minimum_value: 4.5
  - key: colour_contrast_large_text
    label: Colour Contrast — Large Text
    description: Minimum contrast ratio for chart text at or above 18pt (or 14pt bold) against its background, per WCAG 2.1
      AA 1.4.3.
    unit: contrast ratio (x:1)
    minimum_value: 3.0
  - key: colour_contrast_chart_elements
    label: Colour Contrast — Chart Elements
    description: Minimum contrast ratio for non-text chart elements against adjacent colours, per WCAG 2.1 AA 1.4.11.
    unit: contrast ratio (x:1)
    minimum_value: 3.0
  - key: legend_items_direct_label_max
    label: Series Count Requiring Direct Labels
    description: Maximum number of data series for which direct labelling must replace a separate legend. A chart with this
      many series or fewer must label each series on the chart; a separate legend is the split-attention anti-pattern.
    unit: data series
    maximum_value: 8
  - key: max_series_before_small_multiples
    label: Series Count Before Small Multiples
    description: Maximum number of series a single multi-series chart may carry before it must be split into small multiples
      with a shared axis scale; colour discrimination degrades rapidly beyond five distinct hues.
    unit: data series
    maximum_value: 5
  - key: bar_chart_max_categories
    label: Bar Chart Maximum Categories
    description: Maximum number of categories a single bar chart may display before decoding fails and the data belongs in
      a table or split view.
    unit: categories
    maximum_value: 15
  - key: bar_chart_axis_origin
    label: Bar Chart Value-Axis Origin
    description: Required origin of a bar chart's value axis. Bars encode magnitude by length, so a truncated axis is deceptive
      encoding; the axis must start at zero.
    unit: value-axis origin
    target_value: 0
  - key: pie_chart_max_segments
    label: Pie Chart Maximum Segments
    description: Maximum number of segments a pie chart may carry; angle and area comparison fails beyond four segments and
      a sorted horizontal bar chart is the preferred alternative.
    unit: segments
    maximum_value: 4
  - key: max_decimal_places_percentage
    label: Percentage Label Precision
    description: Maximum decimal places on percentage data labels; more is false precision that consumes working memory without
      conveying information.
    unit: decimal places
    maximum_value: 1
  - key: max_decimal_places_currency
    label: Currency Label Precision
    description: Maximum decimal places on rounded currency data labels (for example £1.4M); more is false precision.
    unit: decimal places
    maximum_value: 1
  - key: max_decimal_places_ratio
    label: Ratio Label Precision
    description: Maximum decimal places on ratio data labels; more is false precision.
    unit: decimal places
    maximum_value: 2
  - key: max_decimal_places_count
    label: Count Label Precision
    description: Maximum decimal places on whole-number count labels; counts are integers and carry no decimals.
    unit: decimal places
    maximum_value: 0
  - key: max_title_characters
    label: Chart Title Length
    description: Maximum length of a chart's action-caption title; a caption longer than this stops functioning as an instantly
      readable conclusion.
    unit: characters
    maximum_value: 100
  - key: chart_label_font_size
    label: Chart Label Font Size
    description: Font size for data and axis labels inside charts; below the minimum, labels fail decoding at display size.
    unit: points
    minimum_value: 8
    target_value: 10
  - key: chart_title_font_size
    label: Chart Title Font Size
    description: Font size for chart titles; below the minimum, the action caption is not reliably legible at display size.
    unit: points
    minimum_value: 11
    target_value: 13
  - key: redundant_encoding_min_channels
    label: Redundant Encoding Channels
    description: Minimum number of encoding channels (colour plus direct label, shape, pattern, or line style) whenever colour
      distinguishes data series, so the chart survives greyscale and colour-vision deficiency.
    unit: encoding channels
    minimum_value: 2
  last_updated: '2026-09-01'
  id: coe:artifact/visual_communication/data_visualisation_rubric
  label: Data Visualisation Rubric
  description: Scoring rubric for data visualisation quality covering chart type appropriateness, data-ink ratio, labelling
    clarity, colour accessibility, and insight communication
  home_domain: visual_communication
  status: canonical
  evidence_ids:
