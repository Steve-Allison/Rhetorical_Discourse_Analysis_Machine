_meta:
  file_id: coe:file/domain/learning/assessment_rubrics
  title: Learning — Assessment Rubrics
  last_updated: '2026-09-01'
  authority: Central_Configs
  scope: domain
  ontology_domain: learning
  governing_class: coe:DomainModule
module_id: coe:module/learning/assessment_rubrics
domain: learning
scoring_models:
- dimensions:
  - id: coe:artifact/learning/assessment_scoring_frameworks_rubric/dimension/evaluation_level
    label: evaluation_level
    description: Kirkpatrick-Phillips model level (L1-L5) determining evaluation depth and ROI measurement
    home_domain: learning
    status: canonical
    score_levels:
    - score: 0
      level_label: no_evaluation
      criteria: No formal evaluation planned or conducted
    - score: 1
      level_label: reaction_only
      criteria: Level 1 reaction/satisfaction data collected only
    - score: 2
      level_label: learning_and_behavior
      criteria: Levels 1-3 assessed — reaction, knowledge gain, and behavior transfer measured
    - score: 3
      level_label: full_roi
      criteria: All five levels assessed including business results and ROI calculation
    evidence_ids: &id001
    - coe:source/central-configs-legacy-f6eb98ff
    - coe:decision/v4-migration/learning/assessment_rubrics
    - coe:source/legacy-file/6700375c542d2ccc
    - coe:source/legacy-file/c04e4cd69304fbed
    - coe:source/legacy-file/76aeaac2cc5e291f
  - id: coe:artifact/learning/assessment_scoring_frameworks_rubric/dimension/assessment_timing
    label: assessment_timing
    description: Alignment of assessment events to learning milestones (pre, during, post, transfer)
    home_domain: learning
    status: canonical
    score_levels:
    - score: 0
      level_label: absent
      criteria: No assessment timing strategy defined
    - score: 1
      level_label: post_only
      criteria: Post-training assessment only — no pre-test or transfer measurement
    - score: 2
      level_label: pre_and_post
      criteria: Pre- and post-training assessment with knowledge gain measurement
    - score: 3
      level_label: longitudinal
      criteria: Pre, immediate, 30/60/90-day follow-up, and transfer assessments in place
    evidence_ids: *id001
  - id: coe:artifact/learning/assessment_scoring_frameworks_rubric/dimension/rubric_design_quality
    label: rubric_design_quality
    description: Adherence to rubric design standards for objectivity, clarity, and inter-rater reliability
    home_domain: learning
    status: canonical
    score_levels:
    - score: 0
      level_label: absent
      criteria: No rubric or assessment criteria defined
    - score: 1
      level_label: basic
      criteria: Criteria defined but vague; low inter-rater reliability
    - score: 2
      level_label: structured
      criteria: Clear criteria with behavioural anchors; acceptable reliability
    - score: 3
      level_label: exemplary
      criteria: Validated rubric with anchor examples, calibration, and demonstrated reliability
    evidence_ids: *id001
  - id: coe:artifact/learning/assessment_scoring_frameworks_rubric/dimension/modality_specification
    label: modality_specification
    description: Assessment design appropriateness for delivery modality (elearning, ILT, blended)
    home_domain: learning
    status: canonical
    score_levels:
    - score: 0
      level_label: misaligned
      criteria: Assessment method incompatible with delivery modality
    - score: 1
      level_label: generic
      criteria: Generic assessment applied without modality-specific adaptation
    - score: 2
      level_label: adapted
      criteria: Assessment adapted for delivery modality with appropriate methods
    - score: 3
      level_label: optimised
      criteria: Assessment fully optimised for modality with technology-enhanced features
    evidence_ids: *id001
  last_updated: '2026-09-01'
  id: coe:artifact/learning/assessment_scoring_frameworks_rubric
  label: Assessment Frameworks
  description: Kirkpatrick-Phillips L1-L5 evaluation model, assessment timing patterns, modality-specific specifications,
    rubric design standards, and quality metrics for corporate learning assessment.
  home_domain: learning
  status: canonical
  evidence_ids: *id001
- dimensions:
  - id: coe:artifact/learning/cognitive_load_rubric/dimension/intrinsic_load_management
    label: intrinsic_load_management
    description: Management of inherent content complexity through sequencing, chunking, and element count control
    home_domain: learning
    status: canonical
    score_levels:
    - score: 0
      level_label: overloaded
      criteria: Element count exceeds 7±2 threshold; no chunking strategy applied
    - score: 1
      level_label: high
      criteria: Element count near threshold; partial chunking applied inconsistently
    - score: 2
      level_label: managed
      criteria: Elements within Miller/Cowan limits; logical chunking evident
    - score: 3
      level_label: optimised
      criteria: Minimal element count with progressive disclosure; cognitive pacing throughout
    evidence_ids: *id001
  - id: coe:artifact/learning/cognitive_load_rubric/dimension/extraneous_load_reduction
    label: extraneous_load_reduction
    description: Reduction of unnecessary cognitive effort via text density, typography, and reading physiology standards
    home_domain: learning
    status: canonical
    score_levels:
    - score: 0
      level_label: high_extraneous
      criteria: Dense text, poor typography, no visual scanning patterns — maximises unnecessary load
    - score: 1
      level_label: elevated
      criteria: Some text density or typography issues creating friction
    - score: 2
      level_label: acceptable
      criteria: Text density and typography meet standards; scanning patterns supported
    - score: 3
      level_label: minimal
      criteria: Exemplary text discipline; typography optimises saccade and fixation patterns
    evidence_ids: *id001
  - id: coe:artifact/learning/cognitive_load_rubric/dimension/germane_load_facilitation
    label: germane_load_facilitation
    description: Active schema formation supported by Mayer's multimedia principles and progressive disclosure
    home_domain: learning
    status: canonical
    score_levels:
    - score: 0
      level_label: none
      criteria: No multimedia learning principles applied; no progressive disclosure
    - score: 1
      level_label: partial
      criteria: Some Mayer principles applied; limited schema-building support
    - score: 2
      level_label: adequate
      criteria: Majority of applicable Mayer principles met; disclosure layering present
    - score: 3
      level_label: exemplary
      criteria: Full Mayer principle compliance; systematic progressive disclosure throughout
    evidence_ids: *id001
  - id: coe:artifact/learning/cognitive_load_rubric/dimension/visual_organisation
    label: visual_organisation
    description: Gestalt principles, information architecture, and structural affordances applied to reduce cognitive effort
    home_domain: learning
    status: canonical
    score_levels:
    - score: 0
      level_label: disorganised
      criteria: No evident gestalt grouping or visual hierarchy
    - score: 1
      level_label: partial
      criteria: Some grouping and hierarchy but inconsistent
    - score: 2
      level_label: organised
      criteria: Clear gestalt application and Minto/SCQA information architecture
    - score: 3
      level_label: exemplary
      criteria: Optimal information architecture with consistent gestalt and structural affordances
    evidence_ids: *id001
  - id: coe:artifact/learning/cognitive_load_rubric/dimension/compliance_and_checks
    label: compliance_and_checks
    description: Adherence to ISO 24495-1 plain language standard and quantitative threshold compliance
    home_domain: learning
    status: canonical
    score_levels:
    - score: 0
      level_label: non_compliant
      criteria: Fails plain language thresholds; multiple quantitative violations
    - score: 1
      level_label: partial
      criteria: Some threshold violations; plain language partially applied
    - score: 2
      level_label: compliant
      criteria: Meets quantitative thresholds and plain language standard
    - score: 3
      level_label: exemplary
      criteria: All thresholds met with bonuses; ISO 24495-1 fully applied
    evidence_ids: *id001
  thresholds:
  - key: max_elements_per_slide
    label: Elements Per Slide
    description: Maximum distinct visual elements on one slide, keeping element count inside the Miller/Cowan working-memory
      band.
    unit: elements
    maximum_value: 7
  - key: max_words_per_slide
    label: Words Per Slide
    description: Maximum words of on-slide text; more turns the slide into a reading task competing with the presenter.
    unit: words
    maximum_value: 36
  - key: max_bullets_per_slide
    label: Bullets Per Slide
    description: Maximum bullet points on one slide before the list stops being scannable.
    unit: bullets
    maximum_value: 6
  - key: bullet_hell_threshold
    label: Bullet Hell Ceiling
    description: Hard ceiling of bullets at which the bullet_hell penalty applies regardless of other qualities.
    unit: bullets
    maximum_value: 8
  - key: min_mayer_principles_met
    label: Mayer Principles Met
    description: Minimum count of Mayer's multimedia principles the material must demonstrably meet.
    unit: principles
    minimum_value: 8
  - key: min_critical_principles_met
    label: Critical Mayer Principles Met
    description: Minimum count of the critical Mayer principles (coherence, signalling, redundancy) that must be met; these
      carry the largest effect sizes.
    unit: principles
    minimum_value: 3
  - key: line_length_cpl
    label: Line Length
    description: Characters per line of instructional text; 66 is the typographic optimum and beyond 75 the return sweep degrades.
    unit: characters per line
    target_value: 66
    maximum_value: 75
  - key: line_length_failure_cpl
    label: Line Length Failure Ceiling
    description: Hard ceiling for characters per line; beyond this the line_length_failure penalty applies.
    unit: characters per line
    maximum_value: 80
  - key: paragraph_max_lines
    label: Paragraph Length Ceiling
    description: Maximum lines per paragraph in instructional prose before chunking is required.
    unit: lines
    maximum_value: 6
  - key: heading_frequency_max_words
    label: Heading Frequency
    description: Maximum words between successive headings; longer stretches leave learners without scanning anchors.
    unit: words between headings
    maximum_value: 300
  - key: max_heading_depth
    label: Heading Depth Ceiling
    description: Maximum heading nesting depth; deeper hierarchies stop being navigable structure.
    unit: heading levels
    maximum_value: 3
  - key: wall_of_text_word_threshold
    label: Wall-of-Text Threshold
    description: Maximum words in one unbroken text block before the wall_of_text penalty applies.
    unit: words
    maximum_value: 50
  - key: table_max_columns
    label: Table Column Ceiling
    description: Maximum columns a table may carry as instructional material rather than an appendix data dump.
    unit: columns
    maximum_value: 10
  - key: table_max_rows
    label: Table Row Ceiling
    description: Maximum rows a table may carry as instructional material rather than an appendix data dump.
    unit: rows
    maximum_value: 20
  last_updated: '2026-09-01'
