- dimensions:
  - id: coe:artifact/learning/instructional_design_rubric/dimension/objective_alignment
    label: Objective Alignment
    description: Evaluates whether learning objectives are observable, measurable, and set at the correct Bloom's taxonomy
      level for the intended job performance. Applies Mager's ABCD framework (Audience, Behavior, Conditions, Degree) and
      distinguishes terminal from enabling objectives.
    home_domain: learning
    status: canonical
    evidence_ids: *id001
  - id: coe:artifact/learning/instructional_design_rubric/dimension/activity_mapping
    label: Activity-Objective Mapping (Constructive Alignment)
    description: Evaluates whether activities engage the cognitive process demanded by the objective's Bloom's verb. A 'remember'
      objective maps to recall activities; an 'evaluate' objective demands critique and judgment tasks. Activities that fall
      below the objective's Bloom's level constitute the primary constructive misalignment failure.
    home_domain: learning
    status: canonical
    evidence_ids: *id001
  - id: coe:artifact/learning/instructional_design_rubric/dimension/assessment_validity
    label: Assessment Validity
    description: Evaluates whether the assessment instruments can validly measure what the objective demands, whether formative
      and summative checkpoints are balanced, and whether the design creates a pathway to Kirkpatrick Level 3 (behaviour transfer)
      rather than stopping at Level 2 (learning).
    home_domain: learning
    status: canonical
    evidence_ids: *id001
  - id: coe:artifact/learning/instructional_design_rubric/dimension/scaffold_progression
    label: Scaffold Progression
    description: Evaluates whether the instructional sequence builds competence incrementally from simple to complex whole
      tasks (Merrill's Pebble-in-the-Pond), explicitly manages prerequisite knowledge, and applies the FPI cycle. Integration
      (Principle 5) is the most commonly omitted principle in corporate L&D and is weighted heavily.
    home_domain: learning
    status: canonical
    evidence_ids: *id001
  - id: coe:artifact/learning/instructional_design_rubric/dimension/learner_engagement
    label: Learner Engagement
    description: 'Evaluates the ratio of active to passive learning, the variety of interaction types, the presence of retrieval
      practice mechanisms, and the application of Self-Determination Theory (autonomy, competence, relatedness) as motivational
      scaffolding. Interaction frequency benchmark: every 3-5 minutes of content.'
    home_domain: learning
    status: canonical
    evidence_ids: *id001
  thresholds:
  - key: active_learning_ratio
    label: Active Learning Ratio
    description: Share of learning time spent in active rather than passive modes; the minimum keeps the design defensible
      and the target reflects strong practice.
    unit: ratio
    minimum_value: 0.4
    target_value: 0.6
  - key: engagement_interval_minutes
    label: Engagement Interval
    description: Minutes of content between learner interactions; the target is the research benchmark and the maximum is
      the longest defensible gap.
    unit: minutes
    target_value: 3
    maximum_value: 5
  - key: formative_checks_per_module
    label: Formative Checks Per Module
    description: Formative knowledge checks in one module; the minimum keeps feedback loops alive and the target reflects
      strong practice.
    unit: checks
    minimum_value: 3
    target_value: 5
  - key: interaction_types
    label: Interaction Type Variety
    description: Distinct interaction types used across a module; variety sustains engagement and supports different retrieval
      modes.
    unit: interaction types
    minimum_value: 2
    target_value: 3
  - key: exemplary_interaction_types
    label: Exemplary Interaction Variety
    description: Interaction-type count at which the design earns the exemplary engagement rating.
    unit: interaction types
    minimum_value: 5
  - key: max_objectives_per_lesson
    label: Objectives Per Lesson
    description: Maximum learning objectives one lesson may carry; more splits practice time below mastery depth.
    unit: objectives
    maximum_value: 2
  - key: max_objectives_per_module
    label: Objectives Per Module
    description: Maximum learning objectives one module may carry.
    unit: objectives
    maximum_value: 3
  - key: max_objectives_per_course
    label: Objectives Per Course
    description: Maximum terminal objectives one course may carry; more belongs in a curriculum, not a course.
    unit: objectives
    maximum_value: 5
  - key: bloom_min_level_skill_content
    label: Bloom Level Floor for Skill Content
    description: Minimum Bloom's taxonomy level (1-6) for objectives on skill-building content; skills demand at least Apply
      (level 3), never mere recall.
    unit: Bloom level
    minimum_value: 3
  - key: kirkpatrick_level
    label: Kirkpatrick Evaluation Level
    description: Kirkpatrick evaluation level (1-5) the design must reach; Level 2 (learning) is the floor and Level 3 (behaviour
      transfer) the target.
    unit: Kirkpatrick level
    minimum_value: 2
    target_value: 3
  - key: min_fpi_principles_present
    label: First Principles of Instruction Present
    description: Minimum count of Merrill's First Principles of Instruction the design must evidence; Integration is the most
      commonly omitted.
    unit: principles
    minimum_value: 4
  - key: pass_threshold_percent
    label: Assessment Pass Mark
    description: Minimum score to pass a summative assessment.
    unit: percent
    minimum_value: 80
  - key: module_duration_max_minutes
    label: Module Duration Ceiling
    description: Maximum duration of one module in a corporate learning context.
    unit: minutes
    maximum_value: 45
  - key: topic_duration_max_minutes
    label: Topic Duration Ceiling
    description: Maximum duration of one topic within a module.
    unit: minutes
    maximum_value: 15
  - key: card_duration_max_seconds
    label: Card Duration Ceiling
    description: Maximum duration of one microlearning card or strip.
    unit: seconds
    maximum_value: 90
  - key: spaced_review_interval_1_days
    label: First Spaced Review
    description: Days after initial learning at which the first spaced review is scheduled; first interval of the 1-7-30 spacing
      pattern.
    unit: days
    target_value: 1
  - key: spaced_review_interval_2_days
    label: Second Spaced Review
    description: Days after initial learning at which the second spaced review is scheduled; second interval of the 1-7-30
      spacing pattern.
    unit: days
    target_value: 7
  - key: spaced_review_interval_3_days
    label: Third Spaced Review
    description: Days after initial learning at which the third spaced review is scheduled; final interval of the 1-7-30 spacing
      pattern.
    unit: days
    target_value: 30
  - key: max_continuous_lecture_ilt_minutes
    label: Continuous Lecture Ceiling (ILT)
    description: Maximum unbroken lecture time in instructor-led training before an interaction must occur.
    unit: minutes
    maximum_value: 15
  - key: max_video_segment_minutes
    label: Video Segment Ceiling
    description: Maximum length of one instructional video segment inside a course.
    unit: minutes
    maximum_value: 7
  - key: microlearning_unit_minutes
    label: Microlearning Unit Length
    description: Length of one microlearning unit; below the minimum it cannot carry a complete idea, above the maximum it
      stops being micro.
    unit: minutes
    minimum_value: 3
    maximum_value: 5
