    label: Slide Presentation
    description: 'Slide-based content whose primary load risks are text overload, split attention, and redundancy — guideline caps of 40 words, 7 bullets, and 4 data series per slide'
    home_domain: learning
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
