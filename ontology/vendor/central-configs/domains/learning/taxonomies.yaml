    home_domain: learning
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/load_type
    id: coe:concept/cognitive_load_taxonomy/load_type/germane
