    - coe:concept/cognitive_load_taxonomy/mayer_category
    id: coe:concept/cognitive_load_taxonomy/mayer_category/reduce_extraneous
    label: Reduce Extraneous
    description: 'Mayer principles that eliminate unnecessary cognitive processing — coherence, signalling, redundancy, and spatial and temporal contiguity'
