    id: coe:concept/cognitive_load_taxonomy/design_strategy/progressive_disclosure
    label: Progressive Disclosure
    description: 'Present only what is needed at each moment and reveal complexity gradually, via builds, layered diagrams, and drill-down — targets extraneous load'
    home_domain: learning
    status: canonical
    evidence_ids: *id001
