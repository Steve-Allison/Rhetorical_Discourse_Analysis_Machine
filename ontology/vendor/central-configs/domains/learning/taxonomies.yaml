    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/content_modality
    id: coe:concept/cognitive_load_taxonomy/content_modality/interactive_module
    label: Interactive Module
