    home_domain: learning
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/content_modality
    id: coe:concept/cognitive_load_taxonomy/content_modality/written_document
    label: Written Document
    description: 'Written or eLearning document content risking walls of text and undefined jargon — paragraphs capped at 4 sentences and sections at 6 concepts'
