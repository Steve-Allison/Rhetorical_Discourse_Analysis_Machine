    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/mayer_category
    id: coe:concept/cognitive_load_taxonomy/mayer_category/foster_generative
