  - id: coe:entity/cognitive_load_theory
    label: Cognitive Load Theory
    source: wiki:cognitive-load-theory
    exact_match:
    - https://www.wikidata.org/wiki/Q5141237
    description: John Sweller's theory that working memory has limited capacity, so instruction must minimise extraneous
      load, manage intrinsic load arising from element interactivity, and foster germane load for schema construction.
    home_domain: learning
    status: canonical
    terms:
    - literal: Cognitive Load (intrinsic)
      term_type: full_form
      term_status: admitted
      language: en
    - literal: Cognitive Load (extraneous)
      term_type: full_form
      term_status: admitted
      language: en
    - literal: Cognitive Load (germane)
      term_type: full_form
      term_status: admitted
      language: en
    - literal: CLT
      term_type: initialism
      term_status: admitted
      language: en
    - literal: Sweller's Cognitive Load Theory
      term_type: full_form
      term_status: admitted
      language: en
    edges:
    - subject_id: coe:entity/cognitive_load_theory
      predicate: coe:contains
      object_id: coe:concept/cognitive_load_taxonomy/load_type
      relationship_weight: required
      description: Cognitive Load Theory is the parent theory whose intrinsic, extraneous and germane load types the
        cognitive-load taxonomy classifies.
      statement_id: coe:edge/cognitive-load-theory-contains-load-type
      home_domain: learning
    - subject_id: coe:entity/cognitive_load_theory
      predicate: coe:supports
      object_id: coe:entity/clt_compliance_dimension
      relationship_weight: expected
      description: CLT compliance scoring evaluates designs against Cognitive Load Theory constraints such as split-attention
        and redundancy avoidance.
      statement_id: coe:edge/cognitive-load-theory-supports-clt-compliance-dimension
      home_domain: learning
    - subject_id: coe:entity/cognitive_load_theory
      predicate: coe:enables
      object_id: coe:entity/mayer_extraneous_principle
      relationship_weight: expected
      description: Mayer's extraneous-reduction multimedia principles operationalise Cognitive Load Theory for dual-channel
        instructional media.
      statement_id: coe:edge/cognitive-load-theory-enables-mayer-extraneous-principle
      home_domain: learning
    examples:
    - intrinsic load
    - extraneous load
    - germane load
    - element interactivity
    - expertise reversal effect
  - id: coe:entity/andragogy
    label: Andragogy
    source: wiki:andragogy
    exact_match:
    - https://www.wikidata.org/wiki/Q512288
    description: Malcolm Knowles's adult-learning theory that adults learn best when instruction is relevant, self-directed,
      experiential, problem-centred and intrinsically motivated, contrasting with pedagogy for dependent learners.
    home_domain: learning
    status: canonical
    terms:
    - literal: Knowles's andragogy
      term_type: full_form
      term_status: admitted
      language: en
    - literal: Staged Self-Directed Learning
      term_type: full_form
      term_status: admitted
      language: en
    - literal: SSDL
      term_type: initialism
      term_status: admitted
      language: en
    - literal: Grow's SSDL model
      term_type: full_form
      term_status: admitted
      language: en
    edges:
    - subject_id: coe:entity/andragogy
      predicate: coe:contrasts_with
      object_id: coe:entity/motivation_theory
      relationship_weight: optional
      description: Andragogy states adult-learning process assumptions; Motivation Theory supplies complementary motivational
        frameworks adults bring to those situations — related but not the same construct.
      statement_id: coe:edge/andragogy-contrasts-with-motivation-theory
      home_domain: learning
    - subject_id: coe:entity/andragogy
      predicate: coe:bridges
      object_id: coe:entity/seventy_twenty_ten_model
      relationship_weight: optional
      description: Andragogy's experiential bias bridges workplace 70:20:10 heuristics that also privilege experience over
        coursework — without endorsing the fixed ratio.
      statement_id: coe:edge/andragogy-bridges-seventy-twenty-ten-model
      home_domain: learning
    examples:
    - adult learning principles
    - self-directed learning
    - andragogy versus pedagogy
