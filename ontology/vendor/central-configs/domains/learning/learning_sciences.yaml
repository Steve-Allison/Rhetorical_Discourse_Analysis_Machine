- id: coe:artifact/learning/instructional_design_models
  label: Instructional Design Models and Frameworks
  description: Named instructional design models and frameworks recovered from the knowledge wiki.
  last_updated: '2026-09-01'
  home_domain: learning
  status: canonical
  evidence_ids:
  - coe:decision/curation/2026-09-01/wiki-entry-recovery
  entities:
  - id: coe:entity/boppps_model
    label: BOPPPS Model
    description: Six-component outcomes-focused session-pacing architecture — Bridge-In, Objectives, Pre-Assessment,
      Participatory Learning, Post-Assessment, Summary — giving roughly half of session time to participatory learning.
    home_domain: learning
    status: canonical
    edges:
    - subject_id: coe:entity/boppps_model
      predicate: coe:contrasts_with
      object_id: coe:entity/instructional_event
      relationship_weight: expected
      description: BOPPPS paces a session through six time-budgeted blocks where Gagné sequences nine cognitive events;
        they are alternative session architectures.
      statement_id: coe:edge/boppps-model-contrasts-with-instructional-event
      home_domain: learning
      evidence_ids:
      - coe:decision/curation/2026-09-01/wiki-relational-mining
    ner_label: BOPPPS
    examples:
    - BOPPPS
    - bridge-in
    - pre-assessment and post-assessment blocks
    - participatory learning segment
    confidence_threshold: 0.9
    evidence_ids:
    - coe:decision/curation/2026-09-01/wiki-entry-recovery
  - id: coe:entity/dick_carey_model
    label: Dick and Carey Systems Model
    description: Dick and Carey's rigorously sequential ten-step systems model for high-stakes instruction, built on
      criterion-referenced testing and formative evaluation of the materials rather than the learners.
    home_domain: learning
    status: canonical
    edges:
    - subject_id: coe:entity/dick_carey_model
      predicate: coe:contrasts_with
      object_id: coe:entity/sam_model
      relationship_weight: expected
      description: Dick and Carey's rectilinear ten-step precision and SAM's agile iteration are opposite poles of
        instructional design control.
      statement_id: coe:edge/dick-carey-model-contrasts-with-sam-model
      home_domain: learning
      evidence_ids:
      - coe:decision/curation/2026-09-01/wiki-relational-mining
    ner_label: DICK_CAREY
    examples:
    - Dick and Carey
    - systems approach model
    - ten-step design model
    confidence_threshold: 0.85
    evidence_ids:
    - coe:decision/curation/2026-09-01/wiki-entry-recovery
  - id: coe:entity/elaboration_theory
    label: Elaboration Theory
    description: Reigeluth's simple-to-complex sequencing model that opens with an epitome of the whole subject and
      elaborates in layers using synthesisers and summarisers.
    home_domain: learning
    status: canonical
    edges:
    - subject_id: coe:entity/elaboration_theory
      predicate: coe:supports
      object_id: coe:entity/morrison_ross_kemp_model
      relationship_weight: optional
      description: Reigeluth's simple-to-complex sequencing supplies the content-sequencing element of the
        Morrison-Ross-Kemp design.
      statement_id: coe:edge/elaboration-theory-supports-morrison-ross-kemp-model
      home_domain: learning
      evidence_ids:
      - coe:decision/curation/2026-09-01/wiki-relational-mining
    ner_label: ELABORATION_THEORY
    examples:
