    - literal: Experiential Learning Theory
      term_type: full_form
      term_status: admitted
      language: en
    - literal: ELT
      term_type: initialism
      term_status: admitted
      language: en
    - literal: Concrete Experience
      term_type: full_form
      term_status: admitted
      language: en
    - literal: CE
      term_type: initialism
      term_status: admitted
      language: en
