    label: Baldwin-Ford Transfer Model
    description: Baldwin and Ford's three-condition transfer model — trainee characteristics, training design, work
      environment — governing whether trained skills reach on-job performance.
    home_domain: learning
    status: canonical
    edges:
    - subject_id: coe:entity/baldwin_ford_transfer_model
      predicate: coe:supports
      object_id: coe:entity/kirkpatrick_model
      relationship_weight: expected
      description: Baldwin and Ford's transfer conditions explain what Kirkpatrick Levels 3 and 4 measure — whether
