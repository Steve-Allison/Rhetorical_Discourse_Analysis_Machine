  - id: coe:entity/learning_styles_meshing
    label: Learning Styles Meshing (Refuted)
    description: VARK and the meshing hypothesis — the refuted prescription that matching instruction to a learner's
      reported modality preference improves outcomes; recorded so the prescription can be flagged wherever it appears.
    home_domain: learning
    status: canonical
    edges:
    - subject_id: coe:entity/learning_styles_meshing
      predicate: coe:rebuts
      object_id: coe:entity/four_mat_model
      relationship_weight: expected
      description: The refuted meshing hypothesis undercuts 4MAT's learner-type-matching prescription; the four-question
        design cycle survives, the matching claim does not.
      statement_id: coe:edge/learning-styles-meshing-rebuts-four-mat-model
      home_domain: learning
      evidence_ids:
