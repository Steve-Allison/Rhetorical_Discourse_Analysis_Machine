  - id: coe:entity/morrison_ross_kemp_model
    label: Morrison-Ross-Kemp Model
    description: Kemp, Morrison and Ross's non-linear oval instructional design model of nine interdependent elements
      enterable in any order, uniquely including support-services and resource planning.
    home_domain: learning
    status: canonical
    edges:
    - subject_id: coe:entity/morrison_ross_kemp_model
      predicate: coe:contrasts_with
