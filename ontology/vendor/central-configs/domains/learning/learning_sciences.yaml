  entities:
  - id: coe:entity/bandura_social_cognitive_theory
    label: Bandura's Social Cognitive Theory
    description: Bandura's theory that learning occurs through observing others, mediated by self-efficacy, with person,
      behaviour and environment in reciprocal determinism.
    home_domain: learning
    status: canonical
    edges:
    - subject_id: coe:entity/bandura_social_cognitive_theory
      predicate: coe:supports
      object_id: coe:entity/goal_setting_theory
      relationship_weight: expected
      description: Self-efficacy from social cognitive theory moderates goal level, commitment, persistence, and
        feedback response in Locke and Latham's model.
      statement_id: coe:edge/bandura-social-cognitive-theory-supports-goal-setting-theory
      home_domain: learning
      evidence_ids:
      - coe:decision/curation/2026-09-01/wiki-relational-mining
    ner_label: BANDURA_SCT
    examples:
    - social cognitive theory
    - Bandura's self-efficacy
    - observational learning
    - reciprocal determinism
    - vicarious learning
    anti_examples:
    - social media theory
    confidence_threshold: 0.8
    evidence_ids:
    - coe:decision/curation/2026-09-01/wiki-entry-recovery
  - id: coe:entity/cognitive_apprenticeship
    label: Cognitive Apprenticeship
    description: Collins, Brown and Newman's instructional model making expert thinking visible through modelling,
      coaching, scaffolding, articulation, reflection, exploration and fading.
