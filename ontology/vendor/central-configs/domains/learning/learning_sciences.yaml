      statement_id: coe:edge/baldwin-ford-transfer-model-supports-kirkpatrick-model
      home_domain: learning
      evidence_ids:
      - coe:decision/curation/2026-09-01/wiki-relational-mining
    ner_label: TRANSFER_MODEL
    examples:
