scoring_models:
- dimensions: []
  thresholds:
  - key: min_line_spacing
    label: Line Spacing Floor
    description: Minimum line-height multiple for body text; tighter spacing degrades readability and fails cognitive-accessibility
      guidance.
    unit: line-height multiple
    minimum_value: 1.2
  - key: line_length_characters
    label: Line Length
    description: Characters per line of body text; the 50-75 band supports comfortable saccade return, with 66 the classic
      typographic sweet spot.
    unit: characters per line
    minimum_value: 50
    target_value: 66
    maximum_value: 75
  - key: line_length_failure_characters
    label: Line Length Failure Ceiling
    description: Hard ceiling for characters per line; beyond this the return sweep reliably loses the reader's place.
    unit: characters per line
    maximum_value: 80
  - key: max_paragraph_lines
    label: Paragraph Length Ceiling
    description: Maximum lines in one paragraph of long-form text before it must be broken; longer blocks read as walls of
      text.
    unit: lines
    maximum_value: 10
  - key: heading_density_words
    label: Heading Density
    description: Words between successive subheadings in long-form text; fewer fragments the argument, more leaves readers
      without scanning anchors.
    unit: words between subheadings
    minimum_value: 200
    maximum_value: 300
  - key: max_heading_depth
    label: Heading Depth Ceiling
    description: Maximum heading nesting depth; deeper hierarchies stop being navigable structure.
    unit: heading levels
    maximum_value: 3
  - key: readability_grade_general
    label: Readability Grade — General Audience
    description: Flesch-Kincaid grade band for general-audience prose; below the band reads as oversimplified, above it excludes
      part of the audience.
    unit: Flesch-Kincaid grade
    minimum_value: 8
    maximum_value: 10
  - key: readability_grade_technical
    label: Readability Grade — Technical Audience
    description: Maximum Flesch-Kincaid grade for technical-audience prose; even specialist material must not exceed this.
    unit: Flesch-Kincaid grade
    maximum_value: 12
