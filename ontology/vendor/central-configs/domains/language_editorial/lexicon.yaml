- id: coe:term/lexical/70-20-10-model-079d5583c1
  label: 70:20:10 Model
  surface_form: 70:20:10 Model
  senses:
  - id: coe:sense/by-resource/f9fc7d590f65a4f9
    label: 70:20:10 Model sense
    home_domain: learning
    status: canonical
    evidence_ids:
    - coe:decision/curation/2026-09-01/wiki-entry-enrichment
    definition: Development heuristic holding workplace capability grows roughly 70% from experience, 20% from others
      and 10% from coursework — the experiential direction is supported, the fixed ratio is unwarranted.
    denotes: coe:entity/seventy_twenty_ten_model
    recognition_patterns:
    - (?i)\b70\s+20\s+10\s+Model\b
    - \b70[:/-]20[:/-]10\b
    synonyms: []
