  evidence_ids: *id001
- last_updated: '2026-09-01'
  id: coe:artifact/language_editorial/writing_taxonomy
  label: Writing Taxonomy
  description: Classification of content writing types by writing mode, tone register, content structure, editorial quality
    dimension, and script format
  home_domain: language_editorial
  status: canonical
  concepts:
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    id: coe:concept/writing_taxonomy/writing_mode
    label: Writing Mode
    description: The primary purpose and context of the writing
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/writing_mode
    id: coe:concept/writing_taxonomy/writing_mode/instructional
    label: Instructional
    description: 'Content whose primary purpose is to teach, explain, or guide a learner through a process; produces course modules, learning guides, how-to and knowledge-base articles, and practice prompts.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/writing_mode
    id: coe:concept/writing_taxonomy/writing_mode/editorial
    label: Editorial
    description: 'Content expressing a perspective, analysis, or informed opinion rather than instruction or specification; produces thought-leadership articles, executive summaries, white papers, blog posts, and newsletters.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/writing_mode
    id: coe:concept/writing_taxonomy/writing_mode/scriptwriting
    label: Scriptwriting
    description: 'Content written for spoken delivery or multimedia production, where the words are heard rather than read; produces video narration, podcast scripts, speaker notes, and voiceover copy.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/writing_mode
    id: coe:concept/writing_taxonomy/writing_mode/copywriting
    label: Copywriting
    description: 'Persuasive content designed to drive action or conversion, including product-focused writing that translates features into benefits in precise, specific language rather than generic marketing claims.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/writing_mode
    id: coe:concept/writing_taxonomy/writing_mode/technical
    label: Technical
    description: 'Precise documentation of systems, processes, or specifications, where accuracy and completeness outrank persuasion; produces API documentation, technical specs, release notes, and configuration guides.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/writing_mode
    id: coe:concept/writing_taxonomy/writing_mode/assessment
    label: Assessment
    description: 'Content designed to evaluate knowledge, understanding, or skill; produces quiz and multiple-choice items, scenario and reflection prompts, rubric descriptors, and formative feedback text.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    id: coe:concept/writing_taxonomy/tone_register
    label: Tone Register
    description: The voice and formality level of the writing
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/tone_register
    id: coe:concept/writing_taxonomy/tone_register/formal
    label: Formal
    description: 'Professional, objective, impersonal voice that avoids contractions, colloquialisms, and first person; suited to executive audiences and regulatory content.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/tone_register
    id: coe:concept/writing_taxonomy/tone_register/professional
    label: Professional
    description: 'Clear, direct, authoritative but approachable voice — the default register for corporate learning; avoids slang, hedging, superlatives, and marketing framing without specifics.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/tone_register
    id: coe:concept/writing_taxonomy/tone_register/conversational
    label: Conversational
    description: 'Warm, relatable voice using contractions and direct address; suited to eLearning and video, avoiding passive voice, abstract nouns, and bureaucratic language.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/tone_register
    id: coe:concept/writing_taxonomy/tone_register/inspirational
    label: Inspirational
    description: 'Motivating, visionary, aspirational voice; suited to keynotes and change communication, avoiding negativity, hedging, and bureaucratic framing.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/tone_register
    id: coe:concept/writing_taxonomy/tone_register/empathetic
    label: Empathetic
    description: 'Supportive, understanding voice that acknowledges challenges; suited to change management and onboarding, never dismissive, trivialising, or jargon-laden.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    id: coe:concept/writing_taxonomy/content_structure
    label: Content Structure
    description: The organisational pattern of the written content
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/content_structure
    id: coe:concept/writing_taxonomy/content_structure/linear
    label: Linear
    description: 'Sequential progression from start to finish; suits tutorials, procedures, and narratives.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/content_structure
    id: coe:concept/writing_taxonomy/content_structure/modular
    label: Modular
    description: 'Self-contained sections that can be consumed in any order; suits reference guides, knowledge bases, and FAQs.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/content_structure
    id: coe:concept/writing_taxonomy/content_structure/hierarchical
    label: Hierarchical
    description: 'Top-down organisation moving from general to specific; suits executive summaries, course syllabi, and documentation.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/content_structure
    id: coe:concept/writing_taxonomy/content_structure/problem_solution
    label: Problem Solution
    description: 'Establishes a challenge before presenting its resolution; suits case studies, sales content, and thought leadership.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/content_structure
    id: coe:concept/writing_taxonomy/content_structure/inverted_pyramid
    label: Inverted Pyramid
    description: 'Leads with the most important information and lets supporting detail follow in descending significance; the journalistic pattern suited to news articles, executive briefs, and abstracts.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/content_structure
    id: coe:concept/writing_taxonomy/content_structure/comparative
    label: Comparative
    description: 'Side-by-side analysis of options or approaches; suits product comparisons, framework evaluations, and decision guides.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/content_structure
    id: coe:concept/writing_taxonomy/content_structure/definition_then_benefit
    label: Definition Then Benefit
    description: 'Opens with a precise factual definition of the product or concept, then translates each feature into a concrete audience benefit; avoids opening with marketing claims. Suits product descriptions and knowledge-base entries.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    id: coe:concept/writing_taxonomy/readability_target
    label: Readability Target
    description: The target reading level for the audience
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/readability_target
    id: coe:concept/writing_taxonomy/readability_target/grade_6_8
    label: Grade 6-8
    description: 'Plain-language band (Flesch-Kincaid grade 6-8): short sentences and common words for broad general audiences and must-read operational content.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/readability_target
    id: coe:concept/writing_taxonomy/readability_target/grade_9_12
    label: Grade 9-12
    description: 'High-school band (Flesch-Kincaid grade 9-12): standard business prose for general professional audiences, admitting moderate sentence complexity and everyday business vocabulary.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/readability_target
    id: coe:concept/writing_taxonomy/readability_target/undergraduate
    label: Undergraduate
    description: 'College-level band (roughly Flesch-Kincaid grade 13-16): sustained argument and discipline-general terminology for educated readers outside the specialism.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/readability_target
    id: coe:concept/writing_taxonomy/readability_target/graduate_professional
    label: Graduate Professional
    description: 'Advanced band (Flesch-Kincaid grade 17 and above): dense, abstraction-heavy prose for expert professional readers, as in white papers and scholarly analysis.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/readability_target
    id: coe:concept/writing_taxonomy/readability_target/technical_specialist
    label: Technical Specialist
    description: 'Level defined by domain expertise rather than a grade band: unglossed specialist terminology for practitioners in the field, as in API references and technical specifications.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    id: coe:concept/writing_taxonomy/editorial_quality
    label: Editorial Quality
    description: Key quality dimensions evaluated in editorial review
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/editorial_quality
    id: coe:concept/writing_taxonomy/editorial_quality/clarity
    label: Clarity
    description: 'The degree to which meaning is grasped on first reading: unambiguous wording, concrete referents, and one idea per sentence.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/editorial_quality
    id: coe:concept/writing_taxonomy/editorial_quality/concision
    label: Concision
    description: 'Economy of expression: every word earns its place, with redundancy, filler, and throat-clearing removed without loss of meaning.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/editorial_quality
    id: coe:concept/writing_taxonomy/editorial_quality/consistency
    label: Consistency
    description: 'Uniform terminology, style, formatting, and voice across a piece and its sibling artifacts, so the same thing is always named the same way.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/editorial_quality
    id: coe:concept/writing_taxonomy/editorial_quality/accuracy
    label: Accuracy
    description: 'Factual and technical correctness: claims, figures, names, and procedures verified against their sources.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/editorial_quality
    id: coe:concept/writing_taxonomy/editorial_quality/tone_alignment
    label: Tone Alignment
    description: 'Fit between the writing''s actual voice and the tone register specified for the piece and its audience.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/editorial_quality
    id: coe:concept/writing_taxonomy/editorial_quality/accessibility
    label: Accessibility
    description: 'Usability of the content by readers with disabilities and by assistive technology — navigable structure, meaningful headings, alt text — measured against WCAG 2.1 AA practice.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/editorial_quality
    id: coe:concept/writing_taxonomy/editorial_quality/specificity
    label: Specificity
    description: 'Preference for precise, concrete detail — named mechanisms, numbers, examples — over vague buzzwords and generic marketing claims.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/editorial_quality
    id: coe:concept/writing_taxonomy/editorial_quality/memorability
    label: Memorability
    description: 'The likelihood that key messages are retained after reading, aided by vivid phrasing, strong structure, and deliberate repetition of core ideas.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/editorial_quality
    id: coe:concept/writing_taxonomy/editorial_quality/inclusivity
    label: Inclusivity
    description: 'Use of bias-free, culturally aware language that excludes no reader and lets every member of the audience see themselves addressed.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/editorial_quality
    id: coe:concept/writing_taxonomy/editorial_quality/benefit_clarity
    label: Benefit Clarity
    description: 'How plainly features are translated into concrete audience benefits, so the reader sees what they gain rather than what the product does.'
    home_domain: language_editorial
    status: canonical
    evidence_ids: *id001
  - in_scheme: coe:artifact/language_editorial/writing_taxonomy
    broader:
    - coe:concept/writing_taxonomy/editorial_quality
    id: coe:concept/writing_taxonomy/editorial_quality/diagnostic_precision
    label: Diagnostic Precision
