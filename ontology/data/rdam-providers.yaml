# The machine's technique-boundary bindings to Central_Configs v5.0.0 resources
# (../Central_Configs/dist/build/central.sqlite, verified 2026-11-15) and rdam-owned
# formalism identities where Central_Configs v5.0.0 scopes formalism-internal mechanics to
# consumers. Validated by `pixi run ontology-validate` against ontology/schema/rdam.linkml.yaml;
# projected into rdam/resources/framework-identities.json.
scheme: https://steve-allison.github.io/Central_Configs/v5/schema/coe
bindings:
- boundary: rst
  authority: central_configs
  framework: coe:C06123  # Causal Result & Consequence
  central_concepts:
  - coe:C06123  # Causal Result & Consequence
  - coe:C06124  # Pragmatic Evidence & Justification
  - coe:C06126  # Antithesis & Direct Contrast
  - coe:C06127  # Concessive Counter-Expectation
  - coe:C06130  # Summary & Synthesis Restatement
  requires_structured_input: false
  formalisms:
