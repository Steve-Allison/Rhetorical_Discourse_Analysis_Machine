# The machine's technique-boundary bindings to Central's canonical framework concepts.
# Identity only (006 capability-declaration §Identity binding). Validated by
# `pixi run ontology-validate` against ontology/schema/rdam.linkml.yaml; the same fourteen
# concepts are projected into rdam/resources/framework-identities.json.
scheme: coe:artifact/narrative/analytical_frameworks_taxonomy
bindings:
- boundary: rst
  framework: coe:concept/analytical_frameworks_taxonomy/discourse_structure_framework/rst
  requires_structured_input: false
  formalisms:
  - formalism_id: rst_tree
    framework: coe:concept/analytical_frameworks_taxonomy/discourse_structure_framework/rst
  - formalism_id: erst_graph
    framework: coe:concept/analytical_frameworks_taxonomy/discourse_structure_framework/erst
- boundary: centering
  framework: coe:concept/analytical_frameworks_taxonomy/discourse_structure_framework/centering
  requires_structured_input: false
- boundary: pdtb
  framework: coe:concept/analytical_frameworks_taxonomy/discourse_structure_framework/pdtb
  requires_structured_input: false
- boundary: sdrt
  framework: coe:concept/analytical_frameworks_taxonomy/discourse_structure_framework/sdrt
  requires_structured_input: false
- boundary: speech_acts
  framework: coe:concept/analytical_frameworks_taxonomy/discourse_structure_framework/speech_acts
  requires_structured_input: false
- boundary: classical_rhetoric
  framework: coe:concept/analytical_frameworks_taxonomy/rhetorical_framework/classical_rhetoric
  requires_structured_input: false
- boundary: argument_mining
  framework: coe:concept/analytical_frameworks_taxonomy/argumentation_framework/argument_mining
