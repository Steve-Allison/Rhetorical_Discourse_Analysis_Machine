[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "rdam-dung"
version = "1.0.0"
import-names = ["rdam_dung"]
description = "Rhetorical Discourse Analysis Machine — Dung abstract argumentation provider (grounded, complete, preferred, stable semantics)."
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "Steve Allison", email = "steve.allison@me.com" },
]
dependencies = [
  "rdam>=1.0.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["rdam_dung"]

[tool.hatch.build.targets.sdist]
include = ["/rdam_dung", "/pyproject.toml"]
