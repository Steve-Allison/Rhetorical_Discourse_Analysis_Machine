[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "isanlp_rst"
version = "4.0.0"
description = "End-to-end RST parser across 11 languages (Steve Allison's evolution of the IsaNLP RST Parser by Elena Chistova)."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "Steve Allison", email = "steve.allison@me.com" },
]
maintainers = [
  { name = "Steve Allison", email = "steve.allison@me.com" },
]
# Original RST research code and trained weights by Elena Chistova:
#   - Code:    MIT, copyright Elena Chistova 2020 (see LICENSE)
#   - Weights: CC BY-NC 4.0 (see LICENSE_MODELS)
dependencies = [
  "playwright",
  "razdel",
  "lxml",
  "numpy>=1.26.4",
  "transformers>=5.15.1,<5.16",
  "torch>=2.13,<2.14",
  "huggingface-hub>=0.16.4",
  "tqdm>=4.42",
  "pillow>=10",
  "networkx>=2.5.1",
  "packaging>=24,<27",
  "pydantic>=2.12,<3",
  "rfc8785>=0.1.4,<0.2",
  "python-dotenv>=1.2.1,<2",
  "safetensors>=0.8,<0.9",
]

[project.scripts]
isanlp-rst = "isanlp_rst.cli:main"

[project.urls]
Homepage = "https://github.com/Steve-Allison/isanlp_rst"
Repository = "https://github.com/Steve-Allison/isanlp_rst"
Issues = "https://github.com/Steve-Allison/isanlp_rst/issues"

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "types-lxml>=2026.2.16",
]

# Canonical production-source ingest dependencies. Consumers that use only the
# core `Parser` can install without this extra and avoid the format dependency
# chain.
formats = [
  "doclang[schematron-saxon]>=0.7.3,<0.8",
  "docling-core>=2.92,<2.93",
  "markdown-it-py>=3",
  "mdit-py-plugins>=0.4",
]

# Corpus preparation, training, evaluation, and research dependencies. These
# are deliberately absent from the installable analysis runtime.
offline = [
  "blake3>=1.0,<2",
  "fire>=0.7,<0.8",
  "jsonnet>=0.21,<0.22",
  "nltk>=3.9,<4",
  "peft>=0.20,<0.21",
  "tiktoken>=0.13,<0.14",
]

[tool.setuptools.packages.find]
include = ["isanlp_rst*"]
exclude = [
  "workbench*",
  "tests*",
  "scripts*",
  "tools*",
]

[tool.setuptools.package-data]
"isanlp_rst.rstviewer" = ["data/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "slow: integration tests that download models from HF (~2 GB each)",
  "stress: concurrency, megadoc, and memory-leak stress tests",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
# PyTorch 2.13's arm64 wheel is tagged macOS 14+. Declare the actual runtime
# floor so Pixi validates the wheel rather than resolving against its macOS 13
# compatibility default.
platforms = [{ platform = "osx-arm64", macos = "14.0" }]

[tool.pixi.feature.production.dependencies]
python = "3.14.*"

[tool.pixi.feature.production.pypi-dependencies]
isanlp_rst = { path = ".", editable = true }

[tool.pixi.feature.production.tasks]
production-boundary = "python -m tools.production_boundary --root ."
production-smoke = "python -m tools.production_boundary.production_smoke"
production-artifacts = "python -m tools.production_boundary --root . --artifact dist/isanlp_rst-4.0.0-py3-none-any.whl --artifact dist/isanlp_rst-4.0.0.tar.gz"
production-clean-install = "python tools/production_boundary/clean_install.py --wheel dist/isanlp_rst-4.0.0-py3-none-any.whl --root . --model-store /Users/steveallison/.cache/isanlp_rst/model-releases --full --parity-baseline specs/003-production-codeline-split/evidence/parity-baseline.json"

[tool.pixi.feature.offline.dependencies]
python = "3.14.*"
markdownlint-cli2 = ">=0.14"

[tool.pixi.feature.offline.pypi-dependencies]
isanlp_rst = { path = ".", editable = true, extras = ["dev", "formats", "offline"] }

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "W", "BLE"]
ignore = [
  "E501",  # line-length: rare overruns in docstrings and config tables
  "E741",  # ambiguous variable names (used in research idioms)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
include = [
  "isanlp_rst",
  "workbench",
  "tools",
  "tests",
  "scripts",
]
exclude = [
  "**/__pycache__",
  "**/.pixi",
  "build",
  "workbench/corpora",
  "workbench/experiments",
]
pythonVersion = "3.14"
venvPath = "."
venv = ".pixi/envs/default"
extraPaths = ["scripts"]
reportMissingImports = "warning"     # pyright runs against the active env
# torch's runtime API exposes many names not in __all__ (e.g. torch.device,
# torch.tensor, torch.equal); flagging them as private noise dwarfs real issues.
reportPrivateImportUsage = "none"

[tool.pixi.feature.offline.tasks]
build-production = "python -m tools.production_boundary.build"
validate-production-artifacts = "python -m tools.production_boundary --root . --artifact dist/isanlp_rst-4.0.0-py3-none-any.whl --artifact dist/isanlp_rst-4.0.0.tar.gz"
test = "pytest -m 'not slow and not stress' -q"
test-all = "pytest -q"
test-stress = "pytest tests/stress -q"
test-deep = "pytest -q"
smoke = "python scripts/smoke_test.py"
smoke-full = "python scripts/smoke_test.py --full"
smoke-mps = "python scripts/smoke_test.py --device mps"
smoke-full-mps = "python scripts/smoke_test.py --full --device mps"
cuda-smoke = "python scripts/cuda_smoke.py"
bench = "python -m scripts.bench"
rst-diag = "python scripts/rst_diag.py"
lint = "ruff check isanlp_rst workbench tests scripts tools"
typecheck = "pyright"
mdlint = "python scripts/verify_markdown_manifest.py --lint"
cleanup = "python scripts/cleanup.py"
production-boundary = "python -m tools.production_boundary --root ."
production-smoke = "python -m tools.production_boundary.production_smoke"
offline-smoke = "python -m workbench.smoke"
promote-model = "python -m workbench.promotion.promote"
research-test = "pytest tests/offline/research -q"
research-lint = "ruff check workbench/research tests/offline/research"
production-ingest-test = "pytest tests/ingest -q"
production-ingest-conformance = "pytest tests/ingest -q -k 'conformance or ingest'"
production-ingest-determinism = "pytest tests/ingest/production_ingest/test_determinism.py tests/ingest/production_ingest/test_cache.py -q"
production-ingest-performance = "pytest tests/ingest/production_ingest/test_performance.py -q"
production-ingest-public-api = "pytest tests/ingest/production_ingest/test_public_api.py -q"
production-ingest-clean-install = "python -m tools.production_ingest clean-install"
production-ingest-freeze = "python -m tools.production_ingest freeze"
production-ingest-candidate = "python -m tools.production_ingest candidate"
production-ingest-assess = "python -m tools.production_ingest assess"

[tool.pixi.environments]
default = { features = ["offline"] }
production = { features = ["production"], no-default-feature = true }
offline = { features = ["offline"], no-default-feature = true }
