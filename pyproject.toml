[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "rdam"
version = "6.0.0"
import-names = ["rdam"]
description = "Rhetorical Discourse Analysis Machine: RST/eRST (Steve Allison's evolution of the IsaNLP RST Parser by Elena Chistova), Dung, and IBIS discourse analysis side by side, analysis-only."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "Steve Allison", email = "steve.allison@me.com" },
]
maintainers = [
  { name = "Steve Allison", email = "steve.allison@me.com" },
]
# Original RST research code and trained weights by Elena Chistova:
#   - Code:    MIT, copyright Elena Chistova 2020 (see LICENSE)
#   - Weights: CC BY-NC 4.0 (see LICENSE_MODELS)
dependencies = [
  "playwright",
  "razdel",
  "lxml",
  "numpy>=1.26.4",
  "transformers>=5.15.1,<5.16",
  "torch>=2.13,<2.14",
  "huggingface-hub>=0.16.4",
  "tqdm>=4.42",
  "pillow>=10",
  "networkx>=2.5.1",
  "packaging>=24,<27",
  "pydantic>=2.13,<3",
  "rfc8785>=0.1.4,<0.2",
  "python-dotenv>=1.2.1,<2",
  "safetensors>=0.8,<0.9",
]

[project.scripts]
rdam-rst = "rdam.rst.cli:main"

[project.urls]
Homepage = "https://github.com/Steve-Allison/Rhetorical_Discourse_Analysis_Machine"
Repository = "https://github.com/Steve-Allison/Rhetorical_Discourse_Analysis_Machine"
Issues = "https://github.com/Steve-Allison/Rhetorical_Discourse_Analysis_Machine/issues"

[project.optional-dependencies]
dev = [
  "build>=1.6,<2",
  "hatchling>=1.32,<2",
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "types-lxml>=2026.2.16",
]

# Canonical production-source ingest dependencies. Consumers that use only the
# core `Parser` can install without this extra and avoid the format dependency
# chain.
formats = [
  "doclang[schematron-saxon]>=0.7.3,<0.8",
  "docling-core>=2.92,<2.93",
  "markdown-it-py>=3",
  "mdit-py-plugins>=0.4",
]

# Corpus preparation, training, evaluation, and research dependencies. These
# are deliberately absent from the installable analysis runtime.
offline = [
  "blake3>=1.0,<2",
  "fire>=0.7,<0.8",
  "jsonnet>=0.21,<0.22",
  "nltk>=3.9,<4",
  "peft>=0.20,<0.21",
  "tiktoken>=0.13,<0.14",
]

# One distribution, one package (owner ruling 2026-09-02): `rdam` is the machine, and every
# promoted technique is a sub-package — rdam.rst, rdam.dung, rdam.ibis, ... — shipped in one
# wheel. Release tooling reads this table; it never restates the name or the version.
[tool.hatch.build.targets.wheel]
packages = ["rdam"]

[tool.hatch.build.targets.sdist]
include = [
  "/rdam",
  "/LICENSE",
  "/LICENSE_MODELS",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "slow: integration tests that download models from HF (~2 GB each)",
  "stress: concurrency, megadoc, and memory-leak stress tests",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
# PyTorch 2.13's arm64 wheel is tagged macOS 14+. Declare the actual runtime
# floor so Pixi validates the wheel rather than resolving against its macOS 13
# compatibility default.
platforms = [{ platform = "osx-arm64", macos = "14.0" }]

[tool.pixi.feature.production.dependencies]
python = "3.14.*"

[tool.pixi.feature.production.pypi-dependencies]
rdam = { path = ".", editable = true }

# Task descriptions are the authority `pixi task list` shows; docs point here rather than
# restating them.
[tool.pixi.feature.production.tasks]
production-boundary = { cmd = "python -m tools.production_boundary --root .", description = "Ownership and import boundary inspection of the source tree (no artifacts)" }
production-import-check = { cmd = "python -m tools.production_boundary.import_check", description = "Import the installed distribution without loading weights; here that is the editable source, so it certifies no wheel" }
production-artifacts = { cmd = "python -m tools.production_boundary --root . --release", description = "Boundary inspection plus full validation of the built dist/<version> pair (version from pyproject.toml)" }
production-clean-install = { cmd = "python tools/production_boundary/clean_install.py --root . --model-store models/model-releases --release-id modernbert-v1-a52b70fbc1a3 --full", description = "Wheel certification: pip-install the built dist/<version> wheel into fresh core and formats venvs, network disabled, full installed acceptance on the named release" }

[tool.pixi.feature.offline.dependencies]
python = "3.14.*"
markdownlint-cli2 = ">=0.14"

[tool.pixi.feature.offline.pypi-dependencies]
rdam = { path = ".", editable = true, extras = ["dev", "formats", "offline"] }
linkml = ">=1.11.1, <2"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "W", "BLE"]
ignore = [
  "E501",  # line-length: rare overruns in docstrings and config tables
  "E741",  # ambiguous variable names (used in research idioms)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
include = [
  "rdam",
  "workbench",
  "tools",
  "tests",
  "scripts",
]
exclude = [
  "**/__pycache__",
  "**/.pixi",
  "build",
  "workbench/corpora",
  "workbench/experiments",
]
pythonVersion = "3.14"
venvPath = "."
venv = ".pixi/envs/default"
extraPaths = ["scripts"]
reportMissingImports = "warning"     # pyright runs against the active env
# torch's runtime API exposes many names not in __all__ (e.g. torch.device,
# torch.tensor, torch.equal); flagging them as private noise dwarfs real issues.
reportPrivateImportUsage = "none"

# Task descriptions are the authority `pixi task list` shows; docs point here rather than
# restating them.
[tool.pixi.feature.offline.tasks]
test = { cmd = "pytest -m 'not slow and not stress' -q", description = "Fast suite: no model loads" }
test-all = { cmd = "pytest -q", description = "Every test, including slow model-loading tests and the production smoke" }
test-stress = { cmd = "pytest tests/stress -q", description = "Concurrency, megadoc, and memory-leak stress tests" }
smoke = { cmd = "pytest tests/integration/test_production_smoke.py -q", description = "Load every ModernBERT release in models/model-releases on every available device (CPU, MPS, CUDA) through the public façade; skips visibly when the store is empty" }
lint = { cmd = "ruff check rdam workbench tests scripts tools", description = "Ruff" }
project-framework-identities = { cmd = "python tools/ontology/project_framework_identities.py", description = "Regenerate rdam/resources/framework-identities.json from the vendored Central taxonomy" }
ontology-validate = { cmd = "linkml lint --ignore-warnings ontology/schema/rdam.linkml.yaml && linkml validate ontology/schema/rdam.linkml.yaml && linkml validate -s ontology/schema/rdam.linkml.yaml -C ProviderBindings ontology/data/rdam-providers.yaml && python tools/ontology/project_framework_identities.py --check", description = "Validate the rdam LinkML application profile and its provider bindings against the vendored Central distribution, and check the framework projection is current" }
typecheck = { cmd = "pyright", description = "Pyright, strict" }
mdlint = { cmd = "python scripts/lint_markdown.py --lint", description = "markdownlint-cli2 over the tracked Markdown manifest" }
cleanup = { cmd = "python scripts/cleanup.py", description = "Remove bytecode, tool caches, and dist/ (never .pixi)" }
bench = { cmd = "python -m scripts.bench", description = "Performance bench across models and dtypes" }
rst-diag = { cmd = "python scripts/rst_diag.py", description = "RST quality proxy metrics over .md / Docling / DocLang sources; --json for machine output" }
build-production = { cmd = "python -m tools.production_boundary.build --evidence-dir specs/010-repository-migration/evidence/release", description = "Reproducibly double-build the wheel and sdist from the clean, tagged HEAD into ignored dist/<version>/ (name and version from pyproject.toml) and write the release evidence JSON under specs/010-repository-migration/evidence/release/" }
validate-production-artifacts = { cmd = "python -m tools.production_boundary --root . --release", description = "Boundary gate plus full validation of the built dist/<version> pair: RECORD, provenance, metadata, forbidden members" }
production-boundary = { cmd = "python -m tools.production_boundary --root .", description = "Ownership and import boundary inspection of the source tree (no artifacts)" }
production-import-check = { cmd = "python -m tools.production_boundary.import_check", description = "Import the installed distribution without loading weights; here that is the editable source, so it certifies no wheel" }
production-api-contract = { cmd = "pytest tests/ingest/production_ingest tests/production_boundary -q", description = "Production ingest contract and production-boundary tool suites" }
rst-baseline = { cmd = "python -m tools.production_boundary.rst_baseline", description = "capture --output DIR | compare --baseline DIR: serialized RST public-contract outputs across all six source forms plus CPU analysis on the named release (006 rst-preservation equivalence procedure)" }
production-ingest-test = { cmd = "pytest tests/ingest -q", description = "All ingest tests" }
production-ingest-conformance = { cmd = "pytest tests/ingest -q -k 'conformance or ingest'", description = "Ingest conformance subset" }
production-ingest-determinism = { cmd = "pytest tests/ingest/production_ingest/test_determinism.py tests/ingest/production_ingest/test_cache.py -q", description = "Ingest determinism and cache tests" }
production-ingest-performance = { cmd = "pytest tests/ingest/production_ingest/test_performance.py -q", description = "Ingest preparation performance thresholds" }
production-ingest-public-api = { cmd = "pytest tests/ingest/production_ingest/test_public_api.py -q", description = "Ingest public-surface reconciliation" }
production-ingest-clean-install = { cmd = "python tools/production_boundary/clean_install.py --root . --model-store /Users/steveallison/.cache/isanlp_rst/model-releases", description = "Clean-room install of the built dist/<version> wheel with installed acceptance (no inference) against the user-cache model store" }
production-pre-release-quality = { cmd = "python -m tools.production_boundary.evidence quality --output specs/004-production-api-contract/evidence/pre-release-quality.json", description = "Write the pre-release quality evidence record" }
production-performance-evidence = { cmd = "python -m tools.production_boundary.evidence performance --output specs/004-production-api-contract/evidence/performance.json", description = "Write the preparation performance evidence record" }
production-source-release-gates = { cmd = "python -m tools.production_boundary.evidence source-gates --output specs/004-production-api-contract/evidence/source-release-gates.json", description = "Write the aggregate source-gate evidence record" }
offline-smoke = { cmd = "python -m workbench.smoke", description = "Bounded-start check that every retained offline command (training, evaluation, research, bench) resolves and starts, with receipts" }
promote-model = { cmd = "python -m workbench.promotion.promote", description = "Promote an already-manifested candidate into the immutable local model store (--candidate, --store)" }
promote-modernbert = { cmd = "python -m workbench.promotion.modernbert", description = "Manifest and promote a ModernBERT candidate under a PromotionDecision (--decision <json>); the decision becomes the release's evaluation evidence and is published beside it" }
promotion-record = { cmd = "python -m workbench.promotion.decision", description = "Record a PromotionDecision in workbench/promotions/<technique>/ and optionally publish it beside a model-store release (--file, --publish-to)" }
redeclare-compatibility = { cmd = "python -m workbench.promotion.compatibility", description = "Record, beside an immutable stored release, an evidence-backed re-declaration of the package versions it runs under (--release-id, --range, --declared-by, --reason, --basis); proves the release loads before returning" }
research-test = { cmd = "pytest tests/offline/research -q", description = "Workbench research suites (not a production gate)" }
research-lint = { cmd = "ruff check workbench/research tests/offline/research", description = "Ruff over the research code and its tests" }

[tool.pixi.environments]
default = { features = ["offline"] }
production = { features = ["production"], no-default-feature = true }
offline = { features = ["offline"], no-default-feature = true }
