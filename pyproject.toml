[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isanlp_rst"
version = "3.2.0"
description = "End-to-end RST parser across 11 languages (Steve Allison's evolution of the IsaNLP RST Parser by Elena Chistova)."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "Steve Allison", email = "steve.allison@me.com" },
]
maintainers = [
  { name = "Steve Allison", email = "steve.allison@me.com" },
]
# Original RST research code and trained weights by Elena Chistova:
#   - Code:    MIT, copyright Elena Chistova 2020 (see LICENSE)
#   - Weights: CC BY-NC 4.0 (see LICENSE_MODELS)
dependencies = [
  "playwright",
  "razdel",
  "fire",
  "lxml",
  "jsonnet",
  "nltk",
  "numpy>=1.26.4",
  "transformers",
  "sentencepiece>=0.2.1",
  "tiktoken>=0.7.0",
  "torch>=2.0",
  "huggingface-hub>=0.16.4",
  "tqdm>=4.42",
  "pillow>=10",
  "networkx>=2.5.1",
  # DocLang validator for parse_doclang(..., validate_xml=True) — first-class
  # entry point; not optional. Spec/toolkit: https://github.com/doclang-project/doclang
  "doclang[schematron-saxon]>=0.7,<0.8",
  "isanlp @ git+https://github.com/iinemo/isanlp.git@2a102e59f9718acc7fe259dd8d83c66d5da39794",
]

[project.urls]
Homepage = "https://github.com/Steve-Allison/isanlp_rst"
Repository = "https://github.com/Steve-Allison/isanlp_rst"
Issues = "https://github.com/Steve-Allison/isanlp_rst/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "types-lxml>=2026.2.16",
]

# Docling / Markdown format-native entry points only. The core `Parser` and
# `parse_doclang` do not need these — consumers that only use RST (+ DocLang
# XML) can install isanlp_rst without this extra and avoid the docling-core
# dependency chain.
formats = [
  "docling-core>=2.75.0",
  "markdown-it-py>=3",
  "mdit-py-plugins>=0.4",
]

# Typed RST-tree model (isanlp_rst.utils.serialization_pydantic.RstNode). The
# dependency-free dict helpers in utils.serialization need none of this; this
# extra is only for consumers who want a validated pydantic model.
pydantic = [
  "pydantic>=2",
]

[tool.setuptools.packages.find]
exclude = ["tests"]

[tool.setuptools.package-data]
"isanlp_rst.rstviewer" = ["data/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "slow: integration tests that download models from HF (~2 GB each)",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.dependencies]
python = "3.14.*"
markdownlint-cli2 = ">=0.14"
sentencepiece = ">=0.2.1,<0.3"
tiktoken = ">=0.13.0,<0.14"

[tool.pixi.pypi-dependencies]
isanlp_rst = { path = ".", editable = true, extras = ["dev", "formats", "pydantic"] }

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "W", "BLE"]
ignore = [
  "E501",  # line-length: rare overruns in docstrings and config tables
  "E741",  # ambiguous variable names (used in research idioms)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
include = [
  "isanlp_rst",
  "tests",
  "scripts",
]
exclude = [
  "**/__pycache__",
  ".pixi",
  "build",
  "isanlp_rst/dmrst_parser/src",
  "isanlp_rst/universal_parser/src",
]
pythonVersion = "3.14"
reportMissingImports = "warning"     # pyright runs against the active env
# torch's runtime API exposes many names not in __all__ (e.g. torch.device,
# torch.tensor, torch.equal); flagging them as private noise dwarfs real issues.
reportPrivateImportUsage = "none"

[tool.pixi.tasks]
test = "pytest -m 'not slow' -q"
test-all = "pytest -q"
smoke = "python scripts/smoke_test.py"
smoke-full = "python scripts/smoke_test.py --full"
smoke-mps = "python scripts/smoke_test.py --device mps"
smoke-full-mps = "python scripts/smoke_test.py --full --device mps"
cuda-smoke = "python scripts/cuda_smoke.py"
bench = "python scripts/bench.py"
rst-diag = "python scripts/rst_diag.py"
lint = "ruff check isanlp_rst tests scripts"
typecheck = "pyright"
mdlint = "markdownlint-cli2 README.md UniRST_Metrics.md CLAUDE.md"
cleanup = "python scripts/cleanup.py"
