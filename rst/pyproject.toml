[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "rdam-rst"
version = "1.0.0"
import-names = ["rdam_rst"]
description = "Rhetorical Discourse Analysis Machine — RST/eRST provider adapter over the supported isanlp_rst public contract."
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "Steve Allison", email = "steve.allison@me.com" },
]
dependencies = [
  "rdam>=1.0.0,<2",
  "isanlp_rst>=5.0.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["rdam_rst"]

[tool.hatch.build.targets.sdist]
include = ["/rdam_rst", "/pyproject.toml"]
