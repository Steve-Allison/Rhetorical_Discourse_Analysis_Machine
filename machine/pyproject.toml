[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "rdam"
version = "1.0.0"
import-names = ["rdam"]
description = "Rhetorical Discourse Analysis Machine — aggregate analysis contract over independent discourse and argumentation providers."
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "Steve Allison", email = "steve.allison@me.com" },
]
dependencies = [
  "pydantic>=2.13,<3",
  "rfc8785>=0.1.4,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["rdam"]

[tool.hatch.build.targets.sdist]
include = ["/rdam", "/pyproject.toml"]
