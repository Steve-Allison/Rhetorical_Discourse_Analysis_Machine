name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Fast tests (pytest, no model downloads)
    runs-on: macos-14  # Apple Silicon to match pixi.toml `platforms = ["osx-arm64"]`
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.64.0
          cache: true

      - name: Install environment
        run: pixi install

      - name: Lint
        run: pixi run lint

      - name: Typecheck
        run: pixi run typecheck

      - name: Markdown lint
        run: pixi run mdlint

      - name: Run unit tests (fast)
        run: pixi run test

  # The production smoke (tests/integration/test_production_smoke.py) loads immutable
  # local releases from models/model-releases. Weights are not in git, so it is a local
  # gate: `pixi run smoke`. A CI job that could only skip would certify nothing.
