name: Nightly integration

on:
  schedule:
    # 06:00 UTC daily — chosen to be off-peak for HF
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  smoke-full:
    name: Full smoke (all 5 models, CPU + MPS)
    runs-on: macos-14  # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.64.0
          cache: true

      - name: Cache HuggingFace hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-cache-isanlp-rst-v3-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hf-cache-isanlp-rst-v3-

      - name: Install environment
        run: pixi install

      - name: Smoke (all 5 models on CPU)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: pixi run smoke-full

      - name: Smoke (all 5 models on MPS)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: pixi run smoke-full-mps

      - name: Integration tests (cross-dtype × cross-device × multilingual)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: pixi run pytest -m slow -v
