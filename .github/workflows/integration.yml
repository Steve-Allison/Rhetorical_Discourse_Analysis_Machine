name: Nightly integration

on:
  schedule:
    # 06:00 UTC daily — chosen to be off-peak for HF
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  slow-suite:
    name: Slow suite (model-loading tests; production smoke skips without a local release store)
    runs-on: macos-14  # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.64.0
          cache: true

      - name: Cache HuggingFace hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-cache-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hf-cache-

      - name: Install environment
        run: pixi install

      - name: Slow tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: pixi run pytest -m slow -v
